[project]
name = "telo-feasibility"
version = "0.1.0"
description = "Reproducible feasibility study: distributed sterile-injectable manufacturing under real-world constraints (protocol v1.0.0)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Rikhin Kavuru", email = "rikhin@virahacks.com" }]
dependencies = [
    # numerics and tables
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyarrow>=16",
    # typed schemas and configuration
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # figures
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # global sensitivity (Sobol / sampling); PRCC is implemented in-package
    "SALib>=1.5",
    # workbook audit / reconciliation
    "openpyxl>=3.1",
    # source acquisition (rate-limited, robots-aware)
    "httpx>=0.27",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]
notebooks = ["jupyterlab>=4.2"]

[project.scripts]
telo-feasibility = "telo_feasibility.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telo_feasibility"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running simulation or optimization tests",
    "network: requires network access to official sources",
]
filterwarnings = ["error::DeprecationWarning:telo_feasibility.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["telo_feasibility"]

[[tool.mypy.overrides]]
module = ["SALib.*", "scipy.*", "seaborn.*", "matplotlib.*", "openpyxl.*", "pyarrow.*", "sklearn.*"]
ignore_missing_imports = true
