  profile:
    family: public_private
    product_archetype: Approved small-molecule aqueous sterile injectable in shortage or with recurrent
      shortage history, single vial presentation. Chosen so the second site is a site-transfer supplement
      to an existing application rather than a new filing.
    asset_ownership: A health-system cooperative or GPO-sponsored vehicle supplies the equity; Telo or
      the vehicle acquires an already registered sterile plant rather than building one, and operates
      it. central remains third-party incumbent supply that Telo does not own.
    sites_summary: Two sites. central (R1, incumbent, exists at t0, scale = capacity_factor). second_source
      (R3, acquired registered plant, does not exist at t0, available after commissioning_days 365, scale
      = capacity_factor). Reusing the frozen second_source id shares S2's entity-keyed random streams,
      so the comparison with S2 is paired rather than confounded by draws.
    regulatory_owner: Telo or the cooperative holds or is named in the ANDA. The acquired site enters
      the application through a site-transfer supplement under 21 CFR 314.70, category and duration unresolved
      (G07).
    quality_owner: 'One quality unit per site: central belongs to the incumbent CMO, second_source to
      Telo or the cooperative. They are separate legal entities, but that is not the question the group
      declaration answers. This design''s own regulatory_owner brings the acquired site into the same
      application by site-transfer supplement under 21 CFR 314.70, so one holder''s quality unit disposes
      batches from both, which is non-delegable (21 CFR 211.22(a) (F3-S42), 21 CFR 200.10(b) treating
      extramural facilities as an extension of the manufacturer (F3-S43), and FDA quality-agreements guidance
      stating that a quality agreement cannot delegate CGMP responsibility (F3-S41)). Consequence carried
      into the model: cc_quality is declared on both sites.'
    supplier_graph: Deliberate asymmetry. central draws api_1 (cc_api_1); second_source draws api_2 (cc_api_2),
      which is the point of the architecture. Both draw vial_1 (cc_vial_1) and stopper_1, because no evidence
      was found of a second qualified vial source for this presentation, so container concentration is
      declared and left binding.
    material_flow: Two independent API lanes into two plants, one shared container lane; finished vials
      to four regional stocking points on 4-day lanes, 1 day in the producing site's own region.
    production_steps: Full compounding, filtration or terminal sterilization, aseptic fill, inspection
      and packaging at each site independently. Nothing is split.
    release_pathway: R0 conventional at both sites. No release component is reduced.
    inventory_policy: Regional order-up-to with daily base-stock review; safety_stock_days and site_fg_days
      are searched. site_fg_days is in the search space because the decomposition records the 60 to 180
      day relaxation as the single strongest one found and unavailable to six of eight frozen strategies
      (MD-12).
    allocation_policy: 'proportional in the engine. The contract this architecture needs is member-first
      allocation, which the engine cannot express: minimum_guarantee is accepted by the schema but simulation.py
      passes no per-region minima to allocation.allocate, so it degrades to proportional.'
    customer: Member hospitals of the cooperative, through the GPO contract, plus the open acute-care
      channel for uncommitted volume.
    revenue_mechanism: 'Unit sales under a multi-year minimum-volume commitment, priced above the spot
      generic price by a resilience premium. Not simulated: the engine has no revenue side, so the commitment
      enters only through contracting.contract_requirement and minimum_contracted_utilization.'
    contracting_requirement: 'ContractTerms mechanism take_or_pay, with equity co-investment alongside.
      More fields are answerable from precedent than for any other candidate in this family: term_years
      and committed_units_per_year have a documented comparator shape (about 50 percent of expected volume
      for a minimum of five years in the one published cooperative contract), activation_condition is
      none because this is baseload supply, allocation_rights are members first, and default_risk is that
      members buy the balance elsewhere. payer, purchaser and beneficiary are the same cooperative. price_required_usd_per_unit
      is still unanswered, so missing() returns one field and the strategy is closer to contractable than
      the rest of the family.'
    capital_requirement: Acquisition price of a registered plant plus transfer and requalification, financed
      by cooperative equity rather than by Telo. The engine charges capital_usd_per_site scaled by the
      node capital exponent and does not know who paid, so the ledger shows Telo bearing capital the contract
      says the cooperative bears. That misattribution has to be corrected before any cost ranking is quoted.
    implementation_lead_time: 'commissioning_days 365 for the acquired site, standing for a site-transfer
      supplement plus requalification rather than a 730-day build. This is the load-bearing assumption
      of the candidate and the one most likely to be wrong: one 503B operator bought a registered 110,000
      square foot plant in February 2022 and it was still recorded as not yet inspected 4.2 years later
      (L503B-S01, L503B-S21). MD-17 also makes 365 coincide with warm_up_days.'
    regulatory_gates: *id001
    dominant_risks: 'The 365-day transfer assumption. Shared container supplier leaves cc_vial_1 binding
      for both plants. Two full quality units means the fixed quality cost block (24 to 33 percent of
      annual cost in the pre-R004 run) roughly doubles rather than being shared. Committed volume erodes:
      failure-to-supply clauses in GPO contracts are reported to be weakening (F10-S10), and under 15
      percent of one GPO''s members'' generic injectable purchases went through its shortage program (F10-S15).
      Channel conflict: the cooperative''s existing supplier is the incumbent this architecture second-sources.
      Building or buying capacity does not create demand (F13-S31).'
    potential_moat: 'Capital and demand arrive in one instrument, which is the only documented combination
      that produced a domestic sterile-injectable investment from a purchaser rather than from a grant
      (F13-S23). The moat is the offtake, not the plant. It is weak: the same instrument is available
      to any incumbent the cooperative prefers.'
    falsification_test: 'Commercial: compute minimum_contracted_utilization for the acquired site at a
      price a GPO will state in writing. If the committed share needed to cover fixed and resilience cost
      exceeds the share the cooperative will commit, or exceeds 1.0 of saleable capacity, the architecture
      is dead at that price. Regulatory: a qualified reviewer states the reporting category and expected
      duration of the site-transfer supplement for an acquired registered plant. If it is not materially
      below node_commissioning_days of 730, this collapses into the same commissioning failure as the
      build architectures and should be dropped in favour of S2 with a contract attached.'
  notes: 'PRELIMINARY / ILLUSTRATIVE / NOT FOR EXTERNAL CLAIMS. commissioning_days 365.0 is set equal
    to the frozen global second_source_qualification_days base, which is itself tier 5, so it is a placeholder
    and not independent evidence; MD-17 separately records that 365 coincides with warm_up_days, so a
    design at that value opens on the first measured day and its commissioning effect is a warm-up artifact.
    Also illustrative: fixed_cost_factor 1.15, validation_factor 1.5, safety_stock_days 60, site_fg_days
    60, delivery_days 4, capacity_factor start 1.05. take_or_pay_fraction is deliberately absent: the
    engine charges take-or-pay only on reserved lines, and here the volume commitment is Telo''s revenue
    rather than its cost, so it cannot enter the simulation at all. capacity_factor is in the search space
    and both sites use the central archetype, which avoids MD-8; values above 1.05 correctly incur capacity_expansion_days
    under the R004 rule. P5 warning: Civica is member-owned and Premier/Exela already runs this instrument.
    Configured from candidate key cooperative_registered_second_source (judge tally 9.49, 2 keeps). VERIFICATION
    PASS 2026-09-03 (revision R007): cc_stopper_1 and cc_geo_<region> are now declared on every site plan
    under convention NEW-4 in this file''s header, so this design''s group count changed and every run
    of it made before 2026-09-03 is superseded. S0-S7 carry neither group, so any comparison against them
    must either give them the same groups or report the gap, and the labelled matched-membership control
    (same group count, split membership) has to be run before the added Poisson hazard is read as an added
    correlation. cc_quality is now declared on both sites. Separate legal entities is not the question
    the group answers: this design''s own regulatory_owner brings the acquired site into the same application
    by site-transfer supplement, so one holder''s quality unit disposes both, which is non-delegable.'
- id: S15
  name: Capacity-adequate buffer-payable presentation (inventory-first, no new plant)
  pathway: approved_cmo
