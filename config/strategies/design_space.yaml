    kind: float
    grid: 5
  - name: site_fg_days
    low: 5.0
    high: 180.0
    kind: float
    grid: 4
  - name: material_target_days
    low: 30.0
    high: 180.0
    kind: float
    grid: 3
  - name: region_base_stock
    low: 0.0
    high: 1.0
    kind: int
    grid: 2
  profile:
    family: product_selection
    product_archetype: 'A presentation screened on three gates in order: (1) its existing registered network
      is capacity-adequate (status_quo_utilization below about 0.9), because Phase A says capacity shortfall
      is the only thing that moves a capacity-short product and inventory cannot fix a mass-balance deficit;
      (2) it is on the CMS 86-medicine essential-medicines list that carries the separate IPPS buffer
      payment (F12-S08, LSD-S3); (3) it is NOT currently on the FDA shortage list, because CMS will not
      pay for a newly established buffer of a medicine currently in shortage, which makes this a prevention
      architecture.'
    asset_ownership: Telo owns no manufacturing asset; it owns positioned finished-goods inventory. The
      single declared site is the incumbent line at status-quo scale, carried at full cost attribution
      so the comparison to S0 and S1 is like for like.
    sites_summary: 'One site: the incumbent registered line at status-quo scale (1.0 x capacity_factor
      1.05, identical to S0''s topology); four regional stocking points.'
    regulatory_owner: The existing application holder; Telo is not a manufacturer here. The gate mapping
      still assigns G01-G07 because the architecture depends entirely on the incumbent's application,
      registration, validation and stability state, none of which Telo controls.
    quality_owner: The application holder's quality unit; Telo holds distribution-level responsibilities
      only.
    supplier_graph: 'Unchanged from the status quo: api_1, vial_1, stopper_1, all shared, all left binding.'
    material_flow: Incumbent line to regional stocking points to hospital shelves, rotated first-expiry-first-out.
      No material or intermediate moves through any Telo-controlled step.
    production_steps: Compounding, sterile filtration, aseptic or terminal fill, inspection, testing,
      disposition and packaging, all performed at the incumbent's registered line under the incumbent's
      application. Telo owns and performs none of them; its operation is holding, rotating and positioning
      finished goods.
    release_pathway: Conventional, unchanged, R0.
    inventory_policy: Daily base-stock review to safety stock plus lane time at every region; six-month
      buffer at eligible hospitals. safety_stock_days, site_fg_days, material_target_days and the review
      rule are all searched.
    allocation_policy: Proportional across regions.
    customer: Hospitals of 100 beds or fewer that are not part of a chain organization, which is the eligibility
      the CMS instrument defines.
    revenue_mechanism: 'Service fee for establishing and maintaining a six-month buffer, funded by the
      separate IPPS payment the hospital receives. Reimbursement is not manufacturing cost: the IPPS payment
      reimburses the hospital for establishing and maintaining the buffer; it is not a price for Telo''s
      service and must not be turned into one.'
    contracting_requirement: Per-hospital buffer agreement; the CMS rule permits the stock to be held
      through a manufacturer, distributor or intermediary. ContractTerms.missing() returns price_required_usd_per_unit,
      so under P4 this is not contractable, stated.
    capital_requirement: Working capital in inventory only. The engine has no purchased-finished-goods
      price line, so the reported cost is the incumbent's production cost, not Telo's cost of goods; a
      real transfer price carrying the maker's fixed cost and margin could invert the comparison.
    implementation_lead_time: 'Months, not years: no site, no validation, no commissioning.'
    regulatory_gates:
    - G01
    - G02
    - G03
    - G04
    - G05
    - G06
    - G07
    dominant_risks: 'Firmly occupied space: the nonprofit landscape lists six-month buffer inventory as
      occupied by Civica and NES Reserve and warns against re-entering without a distinguishing mechanism
      (LNPM-S03, LNPM-S19), and Vizient already removes hospital inventory cost with no up-front investment
      and no programme fee. The CMS instrument is narrow on three axes at once and funds prevention for
      drugs that are not short, which is orthogonal to the shortage days the model measures. Model-side,
      the whole effect runs through MD-3 (the frozen regional review rule) and MD-4 (opening-stock cohorts),
      plus the free-opening-inventory defect, so it is artifact-suspect under pruning rule P2 until the
      effect is shown to survive the fixes.'
    potential_moat: None from the inventory itself; only the cost-report documentation and the hospital
      relationship.
    falsification_test: 'Modelling: run against S1 and S0 under matched bounds with region_base_stock
      forced to 0. If the advantage disappears when the review rule reverts to the frozen one, the whole
      result is MD-3 and the architecture has no content beyond a model artifact. Commercial: ask three
      eligible hospitals (100 beds or fewer, not part of a chain) whether their cost report would accept
      a Telo-held buffer as a contractual arrangement with an intermediary under 42 CFR 412.113(g), and
      what they would pay for the service. A no on either kills the revenue mechanism while leaving the
      inventory result intact as an argument for someone else''s balance sheet.'
  notes: 'PRELIMINARY / ILLUSTRATIVE / NOT FOR EXTERNAL CLAIMS. This is the zero-capital benchmark every
    capital-bearing design in the battery has to beat. Every number is tier 5. The candidate''s own profile
    named only G06 because Telo manufactures nothing here; the configured mapping is the wider G01-G07
    because the architecture is entirely dependent on the incumbent''s approved-CMO site state, and mapping
    fewer gates would make the strategy look less gated than it is. The engine has no purchased-finished-goods
    price line, so who owns the plant cannot be expressed in the cost ledger; leaving the multipliers
    at 1.0 is the honest choice and it means the cost numbers are S0''s production cost, not Telo''s.
    Configured from candidate key PS_B_capacity_adequate_buffer (judge tally 9.46, 3 keeps). VERIFICATION
    PASS 2026-09-03 (revision R007): cc_stopper_1 and cc_geo_<region> are now declared on every site plan
    under convention NEW-4 in this file''s header, so this design''s group count changed and every run
    of it made before 2026-09-03 is superseded. S0-S7 carry neither group, so any comparison against them
    must either give them the same groups or report the gap, and the labelled matched-membership control
    (same group count, split membership) has to be run before the added Poisson hazard is read as an added
    correlation. production_steps and material_flow were rewritten on 2026-09-03: the field is the architecture''s
    production steps, not the subset Telo owns, and ''None owned by Telo'' described no step at all. The
    steps happen at the incumbent''s registered line under the incumbent''s application.'
