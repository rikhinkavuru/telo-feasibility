# Design-space strategies S8-S19 (Phase D of the 2026-09 adversarial design-space assignment).
#
# PRELIMINARY / ILLUSTRATIVE / NOT FOR EXTERNAL CLAIMS. Every numeric value in this file is
# tier 5 (illustrative). Nothing here is a finding, a recommendation, or evidence. The starting
# design variables are not optimized designs; the search bounds in each `design_space` block are
# search bounds, not evidence about the world.
#
# Provenance: each design was generated by the Phase B family sweep, scored by three independent
# adversarial judges on different lenses, and configured here in judge-rank order. Every design
# names its source candidate key and judge tally in its `notes`. The narrative entry for each,
# including the entries for the 30 candidates that were NOT configured and why, is
# docs/design_space/novel_architectures.md; the falsification tests are also carried as rows in
# docs/design_space/falsification_register.csv.
#
# Frozen comparators S0-S7 live in illustrative_baseline.yaml and are not redefined here
# (the loader rejects a frozen id in this file). StrategyId admits S0-S20, so S20 is the only
# free id left after this file.
#
# Engine limitations that bear on how these designs must be read (all recorded in
# docs/design_space/bottleneck_decomposition.md section 7 unless marked NEW):
#   MD-3  the frozen regional review rule is a model artifact decisive in 8 of 16 Phase A cells;
#         `region_base_stock` = 1 is the opt-in alternative and several designs below use it, so
#         any comparison against S0-S7 must either give them the same rule or report the gap.
#   MD-15 one product per network and equal regional shares, so no portfolio effect is simulated;
#         `portfolio_capacity_share` and `portfolio_fixed_cost_share` are accounting proxies.
#   MD-17 `capacity_expansion_days`, `second_source_qualification_days` base, `node_commissioning_days`
#         low and `warm_up_days` all equal 365, so a site declared at commissioning_days 365 opens
#         on the first measured day and loses 0% of the measured window. Six designs sit on that
#         value at at least one site: S8, S9, S10 (both hosts), S12 (second_source), S13
#         (second_source) and S14. All six must be run at 180 and 730 as labelled sensitivities
#         before any commissioning claim is quoted. S16 (540), S18 (545), S12's cdmo_r2 (730) and
#         S17/S11/S19 (existing at t0) avoid the boundary.
#   MD-19 fixed 2026-09-03 (revision R007). A common-cause group declared on a *supplier* used to be
#         structurally inert, because group capacity is `1 - impact` and never reaches zero while
#         shipment was gated on capacity > 0. A supplier at fraction f now ships at most f of one
#         full order per day, the same proportional stretch a degraded line already applied. At the
#         frozen hazard rate the measured effect is still zero: S9's matched-membership control
#         returns the same fill in both arms. The defect was that no parameter could have moved it.
#   MD-20 fixed 2026-09-03 (R007). The deterministic screen used to drop reserved sites from capacity
#         and charge no reservation fee, so S11, S13, S16, S17 and S19 screened byte-identical to S0.
#         A reserved line now contributes its exercise duty cycle to capacity and its reservation fee
#         plus take-or-pay to cost. Activation is stochastic and excluded, so the credit is a lower
#         bound.
#   MD-21 fixed 2026-09-03 (R007). The reservation fee and take-or-pay now accrue only while the
#         reserved site exists, matching the R005 rule for fixed operations. This mattered to S16,
#         whose two lines are unavailable for 540 days.
#   MD-22 the deterministic screen derives `common_impact_factor` from topology for S8+ (largest
#         group's share of capacity, which is 1.000 for every design here because each declares at
#         least one group spanning all its non-reserved sites) but reads the workbook's hand-set
#         multiplier for S0-S7 (0.45 to 0.75). No deterministic-screen common-impact comparison
#         between S0-S7 and S8-S19 is valid. The structural fix needs a revision, because S0-S7 are
#         frozen.
#   MD-23 `production.SiteRuntime.exercise_due` requires `active_until_batches <= 0`, so a banked
#         campaign batch blocks an exercise batch one for one. Exercise cadence is therefore
#         measurable only on lines that are rarely activated: the S16 ablation moves fill +0.00163
#         (inside its MCSE of 0.0036, p_meet 0.00 either way) while the same ablation on S17 moves
#         +0.01070 and p_meet 0.92 -> 0.48, both at n = 25 on sodium bicarbonate.
#   MD-24 `take_or_pay_fraction` enters only the cost ledger and changes no service quantity, so an
#         optimizer selecting on cost drives it to its lower bound. It was removed from the S11 and
#         S13 search blocks on 2026-09-03 and is swept as a labelled contract scenario instead.
#   MD-25 `os_integration_usd_per_site_year` is charged only under release scenarios R1-R3 and every
#         design here is R0, so a declared `cc_os` group carries hazard with no cost line. S17 is the
#         only design here that declares it.
#   NEW-1 there is no readiness-decay hazard: `activation_failure_probability` is a per-plan
#         constant with no link to `exercise_batches_per_year`, so exercise batches buy production
#         volume and not reliability. S11, S13, S16, S17 and S19 all depend on that coupling and
#         none of them can demonstrate it on this engine.
#   NEW-2 allocation rights are inert: `strategies.build_strategy` pins every region's
#         criticality_weight at 1.0 and `simulation` never passes a minimum guarantee to
#         `allocation.allocate`, so all four allocation_policy values collapse to proportional.
#         S18 declares `minimum_guarantee` to document its contract, not to model a mechanism.
#   NEW-3 opening inventory is free: `simulation._seed_initial_inventory` seeds site and regional
#         stock into the mass balance and into `counters.initial_units` without charging
#         `variable_production`, so a strategy is endowed with product in proportion to its own
#         stock policy at zero production cost. This flatters every deep-stock design here,
#         S13 and S15 most.
#   NEW-4 common-cause group declaration conventions, settled 2026-09-03 and applied to all twelve
#         designs, because every declared group draws its own Poisson stream at one global rate, so
#         group count is not neutral and structurally identical designs must not be given different
#         exposure for a configuration reason (architecture_taxonomy.md P8):
#         (a) `cc_stopper_1`: every site of every design draws stopper_1, and no design declared any
#             container-closure group, so all twelve tails were optimistic by exactly one shared
#             supplier hazard. `cc_stopper_1` is now declared on every site plan. The frozen builder
#             gives the stopper_1 *supplier* no group, so this is the site-side representation only
#             and S0-S7 do not carry it: any comparison to S0-S7 must either give them the same group
#             or report the gap, exactly as MD-3 requires for the review rule, and one labelled
#             matched-membership control (same group count, split membership) must separate the added
#             Poisson hazard from the added correlation. S18's falsification test is not interpretable
#             until that control is run, because its whole claim is contract-mandated container
#             independence.
#         (b) `cc_geo_<region_id>`: declared on every site plan, in the region the site sits in. This
#             is what R005 already does for a second node in a region and what the frozen builder does
#             for `central`. It was previously declared on some sites and not others, which gave
#             structurally identical designs different group counts (S8 six groups against S14 four
#             for the same two-site R1/R3 shape). Residual gap against the frozen set: wave-0 regional
#             nodes in S5/S6 still carry no geography group.
#         (c) `cc_quality`: declared wherever one quality unit disposes batches from more than one
#             site, which is non-delegable under 21 CFR 211.22(a) (F3-S41, F3-S42, F3-S43). Every
#             design states its reasoning in `profile.quality_owner`. S15 (one site) and S18 (two
#             partners, two ANDAs, two holders) are the only designs without it, and S18 says why.
#         (d) `cc_os`: declared only where one shared software or model version spans the sites. S17
#             declares it; S12, S13 and S16 state explicitly why they do not.
#
id: design_space_2026_09
description: 'Design-space strategies S8-S19 from the Phase B/C adversarial architecture sweep, configured
  in judge-rank order. All inputs illustrative (tier 5); search bounds are search bounds, not evidence.
  Narrative and rejected candidates: docs/design_space/novel_architectures.md.'
source_locator: docs/design_space/novel_architectures.md
designs:
- id: S8
  name: Acquired registered line, two sites, split API and geography
  pathway: approved_cmo
  durable: true
  family: telo_architectures
  release_scenario: R0
  allocation_policy: proportional
  design_variables:
    capacity_factor: 1.0
    delivery_days: 4.0
    safety_stock_days: 60.0
    site_fg_days: 30.0
    material_target_days: 60.0
    material_reorder_days: 14.0
    component_lead_fraction: 0.5
    region_base_stock: 1.0
    emergency_transfers: 1.0
  site_plans:
  - id: central
    region_id: R1
    archetype: central
    scale: 1.05
    exists_at_t0: true
    api_supplier: api_1
    vial_supplier: vial_1
    stopper_supplier: stopper_1
    serves: all
    groups:
    - cc_api_1
    - cc_vial_1
    - cc_geo_R1
    - cc_quality
    - cc_stopper_1
  - id: second_source
    region_id: R3
    archetype: central
    scale: 1.05
    exists_at_t0: false
    commissioning_days: 365.0
    api_supplier: api_2
    vial_supplier: vial_1
    stopper_supplier: stopper_1
    serves: all
    groups:
    - cc_api_2
    - cc_vial_1
    - cc_geo_R3
    - cc_quality
    - cc_stopper_1
    capital_multiplier: 1.0
    fixed_cost_multiplier: 1.0
    validation_multiplier: 1.0
  extra_suppliers: []
  design_space:
  - name: safety_stock_days
    low: 30.0
    high: 365.0
    kind: float
    grid: 4
  - name: region_base_stock
    low: 0.0
    high: 1.0
    kind: int
    grid: 2
  - name: site_fg_days
    low: 30.0
    high: 180.0
    kind: float
    grid: 3
  - name: material_target_days
    low: 30.0
    high: 180.0
    kind: float
    grid: 3
  profile:
    family: telo_architectures
    product_archetype: High-volume, low-price, shelf-stable aqueous small-molecule sterile injectable
      in a glass vial, already approved under an ANDA, whose national demand is at or above installed
      saleable capacity (status_quo_utilization above 1). The sodium bicarbonate 8.4 percent 50 mL dossier
      fits; norepinephrine does not, because beachhead verification found it was not in shortage. Terminal
      sterilizability is a preference for product selection, not a requirement, and is unresolved for
      this presentation (F11-S44).
    asset_ownership: Telo owns the ANDA and both manufacturing sites. Site 1 is the incumbent line acquired
      together with the application and producing on day zero. Site 2 is a second US aseptic line acquired
      as a currently registered, currently inspected operating asset and added to the same application.
      Nothing is leased, nothing is reserved, no capacity is contracted from a third party.
    sites_summary: Two sites. central (R1, central archetype, scale 1.05, exists at t0, serves all four
      regions). second_source (R3, central archetype, scale 1.05, exists_at_t0 false with commissioning_days
      365, serves all four regions). R3 is the same placement frozen S2 gives its second source, so the
      pair is directly comparable.
    regulatory_owner: Telo, as ANDA holder, for both sites. Each site holds its own establishment registration
      under 21 CFR Part 207 as it stands today. No distributed-establishment instrument is used, so nothing
      here depends on the DME proposed rule (F1-S01).
    quality_owner: One Telo quality unit approves or rejects every batch at both sites, which is what
      21 CFR 211.22(a) requires of the application holder including batches made under contract (F1-S08).
      Each site keeps resident quality operations; only disposition is central. Both sites are therefore
      members of cc_quality and are not independent.
    supplier_graph: central takes api_1, vial_1, stopper_1. second_source takes api_2, vial_1, stopper_1.
      The API is dual-sourced across the two sites. Vial and stopper are not, so cc_vial_1 spans both
      sites and is declared. No hub or intermediate supplier, so extra_suppliers is empty.
    material_flow: API, vials and stoppers arrive at each site independently. Finished goods move from
      either site to any of the four regions; interregional transit is delivery_days, intraregional transit
      is 1 day. No bulk or intermediate moves between sites, so no multi-day hold of sterile-filtered
      bulk is required and the EMA 24-hour refiltration expectation does not bite (F5-S16).
    production_steps: Compounding, sterile filtration, aseptic fill, capping, inspection, labeling and
      packaging, end to end at each site. No production step is split across sites.
    release_pathway: 'Conventional compendial release at each site (R0) on the frozen release-component
      vector: sterility incubation, environmental monitoring, assay, endotoxin, serial QA review. No release
      component is reduced, no analytical or model-based release component is claimed, and gate G15 is
      not invoked.'
    inventory_policy: Regional order-up-to with daily base-stock review (region_base_stock = 1, the opt-in
      alternative to the frozen review rule that MD-3 records as decisive in 8 of 16 cells), target =
      safety_stock_days plus lane days. Site finished-goods target site_fg_days. Material order-up-to
      material_target_days with reorder at material_reorder_days. All four are in the search space.
    allocation_policy: Proportional across regions. Criticality weighting and minimum guarantees are contract
      terms no purchaser has agreed, so they are not assumed. They are also inert in this engine (strategies.py
      pins every criticality weight at 1.0 and simulation never passes a minimum guarantee).
    customer: Hospitals and integrated delivery networks buying through a group purchasing organization,
      plus wholesalers. The nearest demonstrated structure is Premier and eleven health systems taking
      a minority stake in Exela Holdings with multi-year commitments to purchase a portion of their volume
      through the GPO (LSIM-S18).
    revenue_mechanism: Unit sales of an approved generic at a contracted price under multi-year supply
      agreements. No readiness fee, no availability payment and no separately billed resilience premium;
      any premium sits inside the unit price. Reimbursement is not treated as cost and no price is inferred
      from ASP.
    contracting_requirement: ContractTerms mechanism = minimum purchase commitment. Payer and purchaser
      are the hospital or IDN through a GPO; beneficiary is the same. Term, committed volume, activation
      condition, allocation rights, default risk and price required are all unanswered, so ContractTerms.missing()
      returns six fields and this architecture is NOT CONTRACTABLE on present evidence. The precedent
      discloses neither term length nor committed volume (LSIM-S18), and no US purchaser has ever been
      found to pay a standing reservation fee for sterile generic capacity (F3-S28).
    capital_requirement: 'Two sites at the product''s capital_usd_per_site scaled by node_capital_scale_exponent,
      plus validation_usd_one_time at each. The base config deliberately charges the acquired line full
      greenfield capital (capital_multiplier 1.0). Published anchors a negotiated price should be tested
      against: 132M USD for a new line and building (F1-S51); 25M USD for a line only, inside an existing
      plant (F1-S52); about 30M USD for four Camden commercial aseptic fill lines with lyophilisation
      in a distressed sale (LCDM-S10). The acquisition price is negotiated and belongs in the human-action
      queue, not in a tier-5 parameter.'
    implementation_lead_time: 'Day zero for the acquired incumbent line. 365 days for the second site,
      covering technical transfer, process performance qualification, analytical transfer and the change-control
      submission under 21 CFR 314.70 (gates G02 and G07, both UNCERTAIN). That is half the frozen node_commissioning_days
      of 730 and it is this architecture''s central claim. MD-17 is open: 365 also equals warm_up_days,
      so at the base value the site opens on the first measured day and loses 0 percent of the measured
      window; 180 and 730 must be run as labelled sensitivities before any commissioning claim is quoted.'
    regulatory_gates: &id001
    - G01
    - G02
    - G03
    - G04
    - G05
    - G06
    - G07
    - G13
    - G14
    dominant_risks: '1. You buy the compliance state with the asset. FDA recorded that release of potentially
      contaminated product at Bloomington continued well after the Novo Nordisk acquisition (LCDM-S2),
      and told Jubilant HollisterStier the same aseptic simulation deficiency had been cited across three
      inspections (LCDM-S7). An open 483 or warning letter at the acquired line stalls the site-addition
      supplement and the 365-day clock is then wrong. 2. Acquirable merchant lines are getting scarcer:
      Catalent Bloomington went captive to Novo Nordisk (LCDM-S1, LCDM-S31), Emergent exited CDMO and
      shut Bayview and Rockville (LCDM-S10, LCDM-S30), Sanofi Ridgefield arrived at Thermo already committed
      to a Sanofi portfolio (LCDM-S9, LCDM-S33). GLP-1 economics outbid shortage generics. 3. One presentation
      cannot fill a full registered line; MD-15 blocks the multi-product run that would fix utilization,
      so the modelled unit cost is an upper bound and the real case rests on a portfolio that does not
      yet exist. 4. Contract insufficiency: no purchaser has committed volume. 5. cc_vial_1 and cc_quality
      still span both sites.'
    potential_moat: 'A named second manufacturing site inside an approved ANDA, with a documented inspection
      history, plus multi-year committed-volume supply agreements. It is a regulatory and contractual
      position, not a technical one. It is weak as moats go: Sagent built exactly this way by buying Athenex''s
      generic injectable assets out of Chapter 11 (LSIM-S28), and any generic injectable company can copy
      it.'
    falsification_test: 'External: ask three owners of currently inspected US aseptic fill lines for an
      asking price and a realistic date for adding the line to an existing ANDA. The architecture fails
      if the price per unit of annual capacity is not materially below the 132M USD new-line-and-building
      anchor (F1-S51), or if the date is not materially inside node_commissioning_days (730 d). Internal:
      run this design against frozen S2 and S4 at n = 100 with matched inventory variables; if the fill
      advantage over S2 is inside the paired MCSE, this is dual sourcing relabelled, not an architecture.
      Commercial: if no GPO or IDN will sign a multi-year committed volume at or above the modelled break-even
      price, ContractTerms stays incomplete and the architecture is reported as not contractable.'
  notes: 'PRELIMINARY / ILLUSTRATIVE / NOT FOR EXTERNAL CLAIMS. Every number is tier 5. scale 1.05 is
    STATUS_QUO_SCALE (R004), so neither site is an expansion and neither pays capacity_expansion_days.
    commissioning_days 365.0 is the base of second_source_qualification_days (low 180 / base 365 / high
    730); run all three as a labelled sensitivity, because MD-17 is open and 365 equals warm_up_days.
    delivery_days 4.0, safety_stock_days 60.0 and site_fg_days 30.0 are frozen-strategy illustrative values
    carried across for comparability; material_target_days 60.0 and material_reorder_days 14.0 are builder
    defaults. region_base_stock 1.0 departs from the frozen review rule on purpose (MD-3). capital, fixed-cost
    and validation multipliers stay at 1.0 so the acquired line is charged as if built, which is the conservative
    direction. Portfolio shares stay at 1.0, so one presentation carries the whole line, which MD-15 says
    overstates cost. Configured from candidate key acquired_registered_line_dual_site (judge tally 10.54,
    3 keeps). VERIFICATION PASS 2026-09-03 (revision R007): cc_stopper_1 and cc_geo_<region> are now declared
    on every site plan under convention NEW-4 in this file''s header, so this design''s group count changed
    and every run of it made before 2026-09-03 is superseded. S0-S7 carry neither group, so any comparison
    against them must either give them the same groups or report the gap, and the labelled matched-membership
    control (same group count, split membership) has to be run before the added Poisson hazard is read
    as an added correlation.'
- id: S9
  name: Dual finished-dose source with an explicit key-starting-material tier
  pathway: approved_cmo
  durable: true
  family: upstream_first
  release_scenario: R0
  allocation_policy: proportional
  design_variables:
    capacity_factor: 1.2
    safety_stock_days: 60.0
    site_fg_days: 30.0
    material_target_days: 60.0
    material_reorder_days: 14.0
    delivery_days: 4.0
    component_lead_fraction: 0.5
    region_base_stock: 1.0
    fixed_cost_factor: 1.15
    validation_factor: 1.5
    emergency_transfers: 1.0
  site_plans:
  - id: central
    region_id: R1
    archetype: central
    scale: 1.0
    exists_at_t0: true
    api_supplier: api_src_a
    vial_supplier: vial_1
    stopper_supplier: stopper_1
    serves: all
    groups:
    - cc_api_1
    - cc_vial_1
    - cc_geo_R1
    - cc_ksm_api_1
    - cc_stopper_1
    - cc_quality
  - id: second_source
    region_id: R3
    archetype: central
    scale: 1.0
    exists_at_t0: false
    commissioning_days: 365.0
    api_supplier: api_src_b
    vial_supplier: vial_1
    stopper_supplier: stopper_1
    serves: all
    groups:
    - cc_api_2
    - cc_vial_1
    - cc_ksm_api_1
    - cc_stopper_1
    - cc_quality
    - cc_geo_R3
  extra_suppliers:
  - id: api_src_a
    name: incumbent API supplier
    component_ids:
    - api
    lead_time_factor: 1.0
    groups:
    - cc_api_1
    - cc_ksm_api_1
  - id: api_src_b
    name: nominally independent API supplier drawing the same key starting material
    component_ids:
    - api
    lead_time_factor: 1.0
    groups:
    - cc_api_2
    - cc_ksm_api_1
  design_space:
  - name: capacity_factor
    low: 1.0
    high: 2.0
    kind: float
    grid: 4
  - name: safety_stock_days
    low: 30.0
    high: 365.0
    kind: float
    grid: 5
  - name: material_target_days
    low: 30.0
    high: 365.0
    kind: float
    grid: 5
  - name: region_base_stock
    low: 0.0
    high: 1.0
    kind: int
    grid: 2
  profile:
    family: upstream_first
    product_archetype: The same shortage-prone multi-source generic sterile injectable as the frozen comparators,
      so this design is directly readable against S2. Aseptic fill, ISO-format vial, conventional compendial
      release.
    asset_ownership: Two owned or contracted finished-dose sites, both on the ledger with capital, fixed
      operations and validation charged. This is the capital-heavy arm of family 9 and it is deliberately
      built to be comparable with S2 rather than to be cheap.
    sites_summary: central (R1, exists at t0, scale 1.0 x capacity_factor) and second_source (R3, scale
      1.0, does not exist at t0, commissioning_days 365.0 which is the second_source_qualification_days
      base). Both serve all regions.
    regulatory_owner: The ANDA holder for both sites. Adding the second site is a prior approval supplement
      under 21 CFR 314.70(b)(2)(iii); a facility not in the original ANDA defaults to the inspection path,
      which is the 10-month GDUFA III clock (F9-S11, F9-S12). Gate G07 governs.
    quality_owner: 'Each site keeps a resident quality unit, but one quality unit disposes batches from
      both, because this design''s own regulatory_owner puts both sites under one ANDA holder and batch
      disposition is non-delegable: 21 CFR 211.22(a) (F3-S42), 21 CFR 200.10(b) treating extramural facilities
      as an extension of the manufacturer (F3-S43), and FDA quality-agreements guidance stating that a
      quality agreement cannot delegate CGMP responsibility (F3-S41). Consequence carried into the model:
      cc_quality is declared on both sites and they are not independent on disposition. The earlier text
      here declared no cc_quality on a separate-legal-entities rationale, which contradicted the single-holder
      disposition in the same sentence; the hedge it carried (''if they are in fact one owner, cc_quality
      must be added'') is resolved rather than carried.'
    supplier_graph: 'Two API suppliers in distinct groups cc_api_1 and cc_api_2, both additionally in
      cc_ksm_api_1 together with both sites. This is the whole point of the design: it prices the difference
      between two API suppliers and two independent API supply chains. USP reports 58 percent of key starting
      materials sole sourced from one country, 41 percent from China, China as sole supplier of at least
      one KSM for 679 APIs, and states that diverse API or finished-dose manufacturing offers little protection
      when all depend on the same upstream source (F9-S5). Shared vial_1 and stopper_1 give both sites
      cc_vial_1.'
    material_flow: Independent site-level material stores, each ordering from its own API supplier at
      material_target_days of cover. No inter-site transfer of intermediates.
    production_steps: Full compounding through packaging at each site. Nothing split, nothing shared.
    release_pathway: R0 conventional at each site. No release component is changed, gate G15 out of scope.
    inventory_policy: Daily base-stock regional review (region_base_stock = 1), safety_stock_days 60 plus
      lane time, site finished-goods 30 days, material 60 days with a 14-day reorder point.
    allocation_policy: proportional, matching the frozen comparators so the S2 read-across is clean.
    customer: 'The same customer the incumbent already serves: hospitals through wholesalers and GPO contracts.
      This design does not create a new customer, which is why it is a control rather than a business
      proposal.'
    revenue_mechanism: Unit sales at contracted price, plus whatever premium a resilience commitment can
      carry. Civica's minimum viable volume contracts are the closest documented instrument, at roughly
      50 percent of expected volume for three to ten years (F10-S01), and the terms are private.
    contracting_requirement: ContractTerms(mechanism='take_or_pay'). missing() returns payer, purchaser,
      term_years, committed_units_per_year and price_required_usd_per_unit. A second full site doubles
      the fixed and validation blocks, so minimum contracted utilization is the binding commercial condition
      and must be reported from contracting.minimum_contracted_utilization at the strategy's own cost.
    capital_requirement: 'Two full sites on the ledger: capital_usd_per_site at scale plus validation_usd_one_time
      x validation_factor 1.5, and fixed_qa_labor_usd_per_site_year x fixed_cost_factor 1.15 at each.'
    implementation_lead_time: 365 days as configured, which is the second_source_qualification_days base.
      MD-17 records that this coincides with warm_up_days, so at this value the second site opens on the
      first measured day and the commissioning penalty is invisible. The declared low and high of that
      parameter, 180 and 730 days, must both be run as labelled variants before any conclusion is drawn.
    regulatory_gates: *id001
    dominant_risks: 'That the second source is not actually independent, which is the risk this design
      exists to price. Beyond that: two replicated quality units and two filings against a product whose
      unit price may be under 5 dollars; a 365-day qualification clock that MD-17 makes unmeasurable at
      its base value; and the general finding that most generic manufacturers cannot afford redundant
      capacity (F7-S16).'
    potential_moat: None. Dual sourcing is standard industry practice and is being legislated as an EU
      procurement criterion (F9-S31). The value of this design is diagnostic, not defensive.
    falsification_test: 'Run the matched-membership control: an identical design in which cc_ksm_api_1
      is split into cc_ksm_api_1 (central, api_src_a) and cc_ksm_api_2 (second_source, api_src_b), so
      the group count is unchanged and only the sharing differs. If p_meet is unchanged inside its binomial
      standard error, the key-starting-material tier does not matter in this model and USP''s concentration
      finding is irrelevant to the engine. If the shared version fails where the split version passes,
      then every dual-sourcing result in the package was produced by an unrepresented correlation and
      must be restated.'
  notes: 'PRELIMINARY / ILLUSTRATIVE / NOT FOR EXTERNAL CLAIMS. This is an adversarial control on the
    one frozen strategy that clears the target at tau = 0.98, not a business proposal. Numbers reused
    rather than invented: capacity_factor 1.2, safety_stock_days 60, delivery_days 4, fixed_cost_factor
    1.15 and validation_factor 1.5 are the frozen S2 illustrative design variables; commissioning_days
    365.0 is the second_source_qualification_days base; material_target_days 60, material_reorder_days
    14, site_fg_days 30 and component_lead_fraction 0.5 are engine defaults; region R3 matches where build_strategy
    places S2''s second source. Two warnings. capacity_factor 1.2 exceeds STATUS_QUO_SCALE 1.05, so under
    R004 central runs at 1.05 until day 365 and only then at 1.2; that is correct behaviour and must not
    be read as a capacity gift. MD-17: commissioning_days 365 equals warm_up_days, so run 180 and 730
    as labelled variants. Configured from candidate key ksm_honest_dual_source (judge tally 9.79, 2 keeps).
    VERIFICATION PASS 2026-09-03 (revision R007): cc_stopper_1 and cc_geo_<region> are now declared on
    every site plan under convention NEW-4 in this file''s header, so this design''s group count changed
    and every run of it made before 2026-09-03 is superseded. S0-S7 carry neither group, so any comparison
    against them must either give them the same groups or report the gap, and the labelled matched-membership
    control (same group count, split membership) has to be run before the added Poisson hazard is read
    as an added correlation. cc_quality is now declared on both sites: this design''s own regulatory_owner
    puts both under one ANDA holder, and disposition is non-delegable, so the earlier hedge is resolved
    rather than carried (F3-S41, F3-S42, F3-S43). MD-19: the supplier arm of a common-cause group was
    structurally inert until 2026-09-03, so the key-starting-material tier this design exists to price
    could not reach the material channel at all; it now can, and at the frozen hazard rate the matched-membership
    control still returns the same fill in both arms at n = 25 (0.997733), which is a property of network
    slack and the 0.1 events per group-year rate, not of the gate. Report the null that way.'
