    would have been optimized to zero (MD-24); it is swept as a labelled contract scenario. (3) cc_os
    is deliberately absent and now says so in production_steps: the transfer schedule, exercise cadence,
    activation decision and reserve policy are a contractual decision rule executed by people, not a shared
    software or model version at the sites.'
- id: S14
