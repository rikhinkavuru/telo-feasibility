    to S3. cc_geo_R3 mirrors the frozen central''s solo cc_geo_R1; cc_cdmo_1 declares that the offtake
    line has one owner. Postponement content is probably zero under MD-15 (one presentation, one market,
    one labeler), so the capacity-matched control must be run before any result is read. Configured from
    candidate key bright_stock_campaign_offtake (judge tally 9.69, 3 keeps). VERIFICATION PASS 2026-09-03
    (revision R007): cc_stopper_1 and cc_geo_<region> are now declared on every site plan under convention
    NEW-4 in this file''s header, so this design''s group count changed and every run of it made before
    2026-09-03 is superseded. S0-S7 carry neither group, so any comparison against them must either give
    them the same groups or report the gap, and the labelled matched-membership control (same group count,
    split membership) has to be run before the added Poisson hazard is read as an added correlation. Three
    configuration corrections on 2026-09-03. (1) The design variable `sites: 2.0` was deleted: `strategies.build_strategy`
    reads it only on the frozen S5/S6 path and `_plans_from_spec` overwrites the plan list whenever site_plans
