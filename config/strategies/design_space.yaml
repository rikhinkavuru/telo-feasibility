  profile:
    family: warm_standby
    product_archetype: 'Aqueous small-molecule sterile injectable in a standard glass vial, single presentation,
      already on an approved ANDA, 24-month shelf life; both study products fit. No claim is made about
      sterilization route: the route is unresolved for sodium bicarbonate in the repository''s own map
      (F11-S44), and this architecture does not depend on it.'
    asset_ownership: Telo owns no manufacturing asset. It holds or contracts the approved application
      and buys campaigns on three third-party registered sterile fill-finish lines. Capital is working
      capital, technical transfer and inventory only.
    sites_summary: 'Four sites, all existing and registered at t0: the incumbent plant (central, R1, scale
      1.05) plus three contracted lines in R2, R3, R4. Telo holds a 50 percent capacity slice of each
      contracted line and each runs 4 rotation campaigns per year, above the Annex 1 9.38 floor of two
      APS per line per shift per year (F7-S13) and above BARDA''s stated one lot per product per site
      per year (F7-S02). Illustrative sizing.'
    regulatory_owner: One application holder. Every contracted line must be named in the approved application
      before t0; this is the decisive design choice in the family, because a site added at activation
      carries a supplement review and possibly a preapproval inspection and then shortens nothing (F7-S14,
      F7-S31).
    quality_owner: 'One quality unit at the application holder dispositions every batch; each contract
      site keeps its own site quality unit under a quality agreement. This is declared as a shared failure:
      cc_quality is on all four sites. PharMEDium is the documented warning about one quality organisation
      spanning several sterile sites under stress (F4-S7, F4-S8).'
    supplier_graph: One API supplier (api_1), one vial supplier (vial_1), one stopper supplier (stopper_1),
      shared by all four sites. No upstream diversification is claimed. cc_api_1 and cc_vial_1 therefore
      stop plants and the material channel at the same time.
    material_flow: API, vials and stoppers ship to each of the four sites independently; finished vials
      ship to four regional stocking points; delivery_days 3 cross-region, 1 day in region; emergency
      transfers enabled.
    production_steps: Compounding, sterile filtration and aseptic fill-finish at each site, whole and
      unsplit. No hub-and-spoke, no bulk transfer, so the EMA 24-hour bulk refiltration expectation (F5-S16)
      is not engaged.
    release_pathway: 'Conventional release at every site: the 14-day sterility incubation is the argmax
      component and is unchanged, plus environmental monitoring, assay, endotoxin and a serial QA review.
      Release scenario R0. No release-assurance claim; gate G15 stays out of scope.'
    inventory_policy: Regional order-up-to with daily base-stock review (region_base_stock = 1), safety_stock_days
      45 at t0 and searched from 10 to 365; site finished-goods target 30 days; material target 90 days
      with a 21-day reorder point. Illustrative.
    allocation_policy: Proportional across regions in the engine. Contractually, Telo holds a priority
      call on its reserved slice at each line; the allocation right is what makes the reservation worth
      anything and is also what suppresses the CMO's other commercial demand (F7-S01). The engine cannot
      represent it.
    customer: Hospital systems buying through a purchasing consortium or a GPO. Three GPOs cover over
      90 percent of US hospitals (LSIM-S20) and Vizient alone serves more than 65 percent of acute care
      providers (LSD-S11), so there is no route to the customer that does not go through that channel.
    revenue_mechanism: 'Sale of finished vials under a multi-year minimum-volume commitment, the Civica
      shape: members commit drug by drug to about 50 percent of expected volume for three to ten years
      (F10-S01, F10-S02, LNPM-S03). No standing readiness fee is assumed from the purchaser, because no
      US hospital system, GPO or state has ever paid one for sterile generic capacity (prior-art review
      section 7 item 17, F3-S28).'
    contracting_requirement: 'Two contracts. Supply side: a two-part capacity option at each CMO, reservation
      fee per unit of reserved capacity plus an execution fee per campaign (F10-S32, F10-S31), with a
      non-performance term because paying for availability without penalising non-delivery is the error
      PJM already diagnosed and fixed (F7-S28, F7-S35). Demand side: committed volume from the consortium.
      Three fields cannot be filled from any source in the evidence base and ContractTerms.missing() must
      report them: committed_units_per_year, default_risk, and price_required_usd_per_unit. No published
      rate card, minimum order value or reservation fee exists anywhere for US sterile fill-finish (competitive
      landscape 1.2), and the only public reservation price has the per-batch figure redacted (F7-S04).
      This strategy is therefore NOT contractable today.'
    capital_requirement: No plant capital at the contracted lines. One-time technical transfer, analytical
      method transfer and process validation at three contract sites, plus a maintained package thereafter,
      plus working capital for 45 days of regional safety stock and 90 days of material. The engine charges
      zero validation for a reserved site Telo does not own (R004), so the ledger understates this architecture.
      In the other direction, the engine charges the incumbent central site's full capital, fixed operations
      and validation to this network's ledger, because ownership is a property of the reserved flag and
      not of the site (MD-14 residual); that is a ledger convention, not a claim about who pays, and it
      must be corrected before any cost ranking is quoted. A Telo-only ledger needs a labelled companion
      design with capital_multiplier, fixed_cost_multiplier and validation_multiplier set to 0.0 on central.
    implementation_lead_time: Bounded by the regulatory step, not by construction. Each site addition
      is a change to an approved application whose reporting category is gate G07 and is not assumed (F7-S31);
      second_source_qualification_days (base 365, range 180 to 730) is the closest sourced analogue in
      the configuration. Activation of an already-filed, already-exercised line is modelled at 30 days,
      against the configuration base of 21 (F7-S30), because the Emergent task order states the reservation
      fee does not include tech transfer, process and analytical development, process development, raw
      materials and lot release testing of a batch (F7-S04).
    regulatory_gates: *id001
    dominant_risks: '(1) G07 and G02: if adding each third-party sterile fill site is a prior-approval
      supplement with a preapproval inspection rather than a CBE, the whole design''s zero-commissioning
      claim collapses into a multi-year regulatory queue. (2) Channel conflict: the priority call that
      makes the reservation valuable is exactly what made CDMO partners refuse BARDA capacity, concerned
      about the risk of being forced out of the sites when the government later needed the capacity (F7-S01),
      and what BARDA''s own RFI names as a deterrent (F3-S19). (3) Contract asymmetry: the one disclosed
      US CDMO capacity agreement puts annual committed capacity obligations on the buyer with no minimum
      purchase obligation on the seller (LCDM-S14). (4) Merchant fill-finish capacity is tight and generics
      are the low-priority customer (LCDM-S20, LCDM-S21). (5) CMO enforcement and exit risk (LCDM-S10,
      LCDM-S2, LCDM-S7). (6) One quality unit across four sterile sites (F4-S7, F4-S8). (7) The design
      pays four sites of fixed QA plus reservation fees, and no purchaser has ever paid for readiness
      on a low-price vial.'
    potential_moat: 'The maintained, exercised, regulator-visible transfer package across several owners,
      plus the allocation rights. The evidence base contains no patentable technology here (F7 section
      9), so the defensible asset is the filed and exercised state of N sites, which takes years to reproduce
      and decays if not exercised. This is also the one thing the competitive landscape names as unoccupied:
      buyer-facing, contract-linked assurance that reserved capacity will still pass an inspection when
      called (landscape 4.1), and a contractible registry of activatable capacity with per-product time-to-first-qualified-batch
      (landscape 4.2). ASPR''s DS-MRN prize challenge is already funding the registry half (LGOV-S17,
      LGOV-S51).'
    falsification_test: 'Three tests, any one of which kills it. (a) Regulatory: a qualified CMC reviewer
      states the reporting category for adding a third-party sterile fill-finish site to an approved ANDA,
      and whether any approved ANDA lists three or more US sterile fill sites for one presentation (needs
      Module 3.2.P.3 tables that are not public). If the answer is prior-approval supplement with preapproval
      inspection at each site, the architecture is dominated by simply expanding the incumbent plant.
      (b) Commercial: a named CMO quotes four campaigns per year with a priority call. If no CMO will
      sell allocation rights at any price, the design has no supply side. (c) Model: rerun with exercise_batches_per_year
      = 0 at all three lines, and separately move activation_failure_probability across its range. If
      fill moves with the exercise volume and not with the failure probability, the mechanism is production
      volume rather than readiness and the architecture must be re-justified as distributed routine contracted
      supply rather than as standby.'
  notes: 'PRELIMINARY / ILLUSTRATIVE / NOT FOR EXTERNAL CLAIMS. scale, exercise_batches_per_year, activation_failure_probability,
    activation_lead_days and the portfolio shares are chosen for this architecture and have no source;
    exercise cadence 4/yr sits above the Annex 1 floor of two APS per line per shift per year (F7-S13)
    and above BARDA''s one-lot-per-year statement (F7-S02) but is not evidence. activation_lead_days 30
    replaces the configuration base of 21 (F7-S30) because a reservation fee buys the room and the crew,
    not a transferred process (F7-S04). take_or_pay_fraction is set to 0.10, not to the contractual commitment,
    because the engine charges take-or-pay as a pure additional cost with no offsetting output and does
    not net it against the rotation batches actually run and sold; setting it equal to the commitment
    would double count. cc_os and cc_quality are declared on all four sites because one Telo layer and
    one Telo quality unit span them. KNOWN RECLASSIFICATION RISK: with no readiness-decay hazard in the
    engine, the warm-versus-cold gap this design measures is exercise-batch production volume, not activation
    reliability, so on this engine it is distributed routine contracted supply wearing a standby label
    and should be reported that way unless the hazard is built. Configured from candidate key rotating_campaign_network
    (judge tally 9.31, 2 keeps). VERIFICATION PASS 2026-09-03 (revision R007): cc_stopper_1 and cc_geo_<region>
    are now declared on every site plan under convention NEW-4 in this file''s header, so this design''s
    group count changed and every run of it made before 2026-09-03 is superseded. S0-S7 carry neither
    group, so any comparison against them must either give them the same groups or report the gap, and
    the labelled matched-membership control (same group count, split membership) has to be run before
    the added Poisson hazard is read as an added correlation. Two items recorded on 2026-09-03. (1) MD-25:
    the engine charges `os_integration_usd_per_site_year` only under release scenarios R1-R3, and this
    design is R0, so the cost of the shared Telo layer that cc_os represents sits outside the ledger,
    in the same way S11 records that the finishing operation''s capital does. cc_os stays declared; the
    hazard is the honest half. (2) The 4/yr rotation cadence is a scrap cost as well as a fee. In a quiet
    world (site failures, common-cause events, demand shocks, demand CV and release-time CV all zeroed)
    over a 2191-day horizon this design runs 75 exercise batches on the capacity-adequate presentation
    (norepinephrine) and reports expiry_rate 0.14901 against 0.0 for S0; on the capacity-short presentation
    (sodium bicarbonate) it is 0.00126, because everything sells. S19''s notes already carry the equivalent
    warning that exercise batches must be sold or scrapped and that Warstopper manufacturers refused to
    hold volumes they might not sell.'
