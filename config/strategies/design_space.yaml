  profile:
    family: multi_product_portfolio
    product_archetype: An approved aqueous small-molecule sterile injectable in a standard vial, compatible
      with a general multi-product aseptic line, with penicillins, beta-lactams, cytotoxics, hormones
      and high-potency compounds excluded (F6-S01, F6-S10, F6-S07, F6-S08, F6-S19).
    asset_ownership: Telo owns no plant. The same committed volume is split across two unaffiliated host
      sites, each supplying half, each with its own quality unit and its own registration.
    sites_summary: 'Three site plans. central: incumbent plant, R1, scale 1.05. shared_suite_1: host A
      in R3 on api_1, 20 percent of a full line. shared_suite_2: host B in R4 on api_2, 20 percent of
      a full line. Both available after 365 d. Chronic addition is 0.40 nominal-site-equivalents, matched
      to the single-host anchor-tenancy design so the two differ only in concentration.'
    regulatory_owner: Telo holds the application and lists both sites. Two site additions means two change-control
      packages under 21 CFR 314.70 and two facility evaluations, both UNCERTAIN under gate G07 (F6-R02,
      F3-S44, F3-S45). Woodcock and Wosinska found only 11 of about 900 sterile-injectable ANDAs approved
      2000-2011 referenced more than one finished-dose facility, so a deliberately two-sited generic is
      unusual (F6-S37).
    quality_owner: 'Two host quality units under two quality agreements; Telo''s quality unit performs
      disposition at both, which 21 CFR 211.22(a) makes non-delegable (21 CFR 211.22(a) (F3-S42), 21 CFR
      200.10(b) treating extramural facilities as an extension of the manufacturer (F3-S43), and FDA quality-agreements
      guidance stating that a quality agreement cannot delegate CGMP responsibility (F3-S41)). Consequence
      carried into the model: cc_quality is declared on central, shared_suite_1 and shared_suite_2, and
      the three sites are not independent. A disposition-function failure stops release from all three
      at once. This is the same reading S12 applies to its three unaffiliated partner sites.'
    supplier_graph: Host A draws api_1 with the incumbent; host B draws api_2 and is the only independent
      API path. Vials and stoppers come from vial_1 and stopper_1 for every site, so container supply
      stays a shared common cause that this architecture does not fix; that is family 9's mechanism, not
      this one.
    material_flow: Two parallel flows from API and container suppliers into two host sites, then to four
      regional stocking points.
    production_steps: All finished-dose steps at the two hosts. Telo owns the application, both transfer
      packages, portfolio and slot scheduling, and disposition.
    release_pathway: Conventional (R0), release components unchanged. Nothing here shortens release.
    inventory_policy: Order-up-to at four regional stocking points plus site finished-goods cover, with
      safety_stock_days, site_fg_days, material_target_days and the regional review rule searched.
    allocation_policy: proportional, matching S0-S7.
    customer: Hospital systems and their group purchasing organizations through the wholesale channel.
    revenue_mechanism: Unit sales at a contracted price. No readiness payment is assumed anywhere in this
      design; it has no reserved capacity and therefore no reservation fee.
    contracting_requirement: Two tolling agreements plus one offtake. Payer Telo for manufacture, purchaser
      the GPO or health system, beneficiary hospitals; term, committed volume and price unknown; activation
      condition none, because both sites run continuously; allocation rights none needed; default risk
      each host's compliance state independently. ContractTerms.missing() returns term_years, committed_units_per_year
      and price_required_usd_per_unit. Not contractable until a purchaser answers, and stated as such.
    capital_requirement: 'No greenfield capital at the two hosts. The ledger charges 20 percent of a full
      site''s capital and fixed quality cost at each host, plus one full product-specific validation at
      each host, which is the price of independence: the validation block roughly doubles against a single-host
      tenancy while the fixed-quality block is unchanged. The engine also charges the incumbent central
      site''s full capital, fixed operations and validation to this network''s ledger, because ownership
      is a property of the reserved flag and not of the site (MD-14 residual); that is a ledger convention,
      not a claim about who pays, and it must be corrected before any cost ranking is quoted. A Telo-only
      ledger needs a labelled companion design with capital_multiplier, fixed_cost_multiplier and validation_multiplier
      set to 0.0 on central.'
    implementation_lead_time: 365 d at each host in parallel, from second_source_qualification_days (tier
      5). Two regulatory submissions rather than one, both UNCERTAIN under G07. MD-17 applies here too.
    regulatory_gates: *id001
    dominant_risks: 'The independence may be smaller than it looks. Both hosts draw the same container
      and stopper supplier, both are subject to the same FDA inspection posture, and the model''s own
      R005 rule records that co-located sites share geography. Second, two hosts means two chances of
      a compliance event affecting Telo, so mean availability improves while the frequency of partial
      disruption rises. Third, splitting a small volume across two lines halves each campaign and worsens
      the minimum-campaign-size problem, for which no source gives a number (F6 section 9). Fourth, cost:
      a second full validation and a second quality-agreement overhead for the same volume.'
    potential_moat: 'Being one of the very few generic applications with two qualified finished-dose sites
      (F6-S37). That is a durable position only if purchasers pay for it, and HHS records exactly the
      opposite pressure: prices driven so low that they create insufficient incentives for redundancy
      (F6-S18).'
    falsification_test: 'Run the paired comparison against a single-host control at matched chronic capacity.
      The control is an internal variant of this design, not a separate configured strategy: collapse
      shared_suite_1 and shared_suite_2 into one host in R3 at portfolio_capacity_share 0.4, portfolio_fixed_cost_share
      0.4 and validation_multiplier 2.5 (so it pays exactly one full product-specific validation), keeping
      central, the suppliers, the group declarations and every design variable identical, so both arms
      add 0.40 nominal-site-equivalents. The earlier wording named an anchor-tenancy sibling strategy
      that is not configured anywhere and the test was therefore untestable as written. If p_meet does
      not improve, the second quality-unit share and the second full validation buy nothing and concentration
      wins. Then run the decisive ablation: move shared_suite_2 back to api_supplier api_1 with group
      cc_api_1. If the advantage disappears, the mechanism was API independence, not site independence,
      and this belongs to family 9. Evidence-side: if no second US host will take a 20 percent tenancy
      of a full line for a low-price generic, the architecture has no counterparties; the base rate is
      about 1 percent of sterile-injectable ANDAs (F6-S37).'
  notes: 'PRELIMINARY / ILLUSTRATIVE / NOT FOR EXTERNAL CLAIMS. Shares of 0.20 at each host are chosen
    to match a single-host design''s chronic addition of 0.40 nominal-site-equivalents exactly, so the
    pair is a controlled comparison of concentration at equal capacity. validation_multiplier 5.0 at each
    host undoes the 0.20 share so each site pays one full product-specific validation, which is the honest
    structure (F6-S11, F6-S04). Container and stopper supply stay shared on purpose; declaring a second
    container source would confound this test with family 9''s mechanism. api_2 on host B is deliberate:
    the decomposition resolves supplier concentration in 10 of 16 cells and flips 3, so a split that keeps
    one API source is not a split. Run the api_1 ablation to separate the two mechanisms. Configured from
    candidate key split_tenancy_two_hosts (judge tally 9.77, 3 keeps). VERIFICATION PASS 2026-09-03 (revision
    R007): cc_stopper_1 and cc_geo_<region> are now declared on every site plan under convention NEW-4
    in this file''s header, so this design''s group count changed and every run of it made before 2026-09-03
    is superseded. S0-S7 carry neither group, so any comparison against them must either give them the
    same groups or report the gap, and the labelled matched-membership control (same group count, split
    membership) has to be run before the added Poisson hazard is read as an added correlation. cc_quality
    is now declared on all three sites, because Telo''s quality unit disposes at both hosts and that is
    non-delegable; the previous text asserted the opposite in the same sentence pair. The single-host
    control named in falsification_test is an internal variant of this design (one host at portfolio shares
    0.4 and validation_multiplier 2.5), not a separate configured strategy: no anchor-tenancy sibling
    exists anywhere in the package, so the test as previously written was untestable. capital_requirement
    now records that the engine charges the incumbent central site''s full capital, fixed operations and
    validation to this ledger. Re-run with cc_quality present, as the blocker required: against its internal
    single-host control at matched chronic capacity (one host at portfolio shares 0.4 and validation_multiplier
    2.5) the two-host design reaches mean fill 0.95507 (MCSE 0.00755) at 18,612,988 USD/yr against 0.95353
    (MCSE 0.00809) at 17,918,556 USD/yr, p_meet 0.16 in both arms. The service difference is inside its
    MCSE and the second host costs 0.69M USD/yr more, so on this engine the second quality-unit share
    and the second full validation buy nothing measurable and concentration wins. verification-pass paired
    run, post-R007 configuration, sodium bicarbonate, master seed 20260901, n = 25, horizon 2191 d after
    a 365 d warm-up, no manifest; it is model behaviour and must be re-run inside the Phase D battery
    before it is quoted.'
