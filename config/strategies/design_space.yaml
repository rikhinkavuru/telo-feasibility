      the engine has no route attribute; the route stays whatever the incumbent presentation uses.
    asset_ownership: Telo owns no manufacturing asset. Three third-party registered US establishments
      supply under contract. Telo owns the application or the label, the quality unit, the technical-transfer
      and analytical-method packages, and the finished-goods inventory.
    sites_summary: Three pre-existing third-party sites. central in R1 at scale 1.05 is the incumbent
      line, available on day 0. second_source in R3 at scale 0.30 has an independent API source and an
      independent container source and becomes available after 365 days of transfer, validation and a
