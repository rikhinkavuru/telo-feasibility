      the three virtual-network candidates.'
    capital_requirement: 'No plant capital. Working capital dominates: a reserve of this size is the main
      balance-sheet item, plus transfer and validation at one firm partner, plus the reservation fee.
      In the engine as declared, second_source still carries the product per-site capital and fixed cost
      because ownership is a property of the reserved flag, so the reported capital is a modelling convention.'
    implementation_lead_time: Day 0 for incumbent supply and the option site, 365 days for the firm partner,
      21 days per activation. Inventory builds within a replenishment cycle, so the reserve leg is the
      fastest of the three to stand up and the only one that does not wait on a filing.
    regulatory_gates: *id001
    dominant_risks: '1. Shelf life caps the reserve: at 24 months, a 365-day safety stock is half the
      life and expiry scrap becomes the binding cost, and R004 changed exactly this arithmetic by spreading
      opening stock across four cohorts, so every pre-2026-09-03 safety-stock conclusion has to be re-run
      (MD-4). 2. The reserve is only as good as the review rule, which Phase A records as a model artifact
      decisive in 8 of 16 cells (MD-3), so a result driven by region_base_stock alone is an artifact result.
