    low: 0.0
    high: 1.0
    kind: int
    grid: 2
  profile:
    family: contracts_procurement
    product_archetype: Aqueous small-molecule generic sterile injectable in a glass vial. The second container
      source is a second qualified vial presentation, which is why G06 is load-bearing here and not boilerplate.
    asset_ownership: No owned plant. Two registered partner lines under a single committed supply agreement
      whose terms, not Telo's capital, buy the independence.
    sites_summary: Two. central is the incumbent approved line at the status-quo scale. second_source
      is a second registered partner line added to the application after a qualification lead, contractually
      required to run a distinct API source and a distinct container source.
    regulatory_owner: Each partner ANDA holder. Adding a second container-closure system is a stability
      and container-closure change on the holder's application, not a labeling change.
    quality_owner: Each partner site's own quality unit dispositions the batches it makes, because each
      partner holds its own ANDA rather than supplying under one shared application (see regulatory_owner).
      21 CFR 211.22(a) therefore places disposition with two different holders and no single quality unit
      spans the two sites, which is why no cc_quality group is declared. Contrast S12, where one holder's
      quality unit dispositions all three partner sites and cc_quality is declared (21 CFR 211.22(a) (F3-S42),
      21 CFR 200.10(b) treating extramural facilities as an extension of the manufacturer (F3-S43), and
      FDA quality-agreements guidance stating that a quality agreement cannot delegate CGMP responsibility
      (F3-S41)).
    supplier_graph: central takes api_1, vial_1, stopper_1. second_source takes api_2, vial_2 (a new supplier
      declared in extra_suppliers with lead_time_factor 0.5, matching the component_lead_fraction convention)
      and stopper_1. The stopper source is deliberately left shared, because the contract as drafted does
      not reach it, and pretending otherwise would be the independence assumption the prohibitions forbid.
    material_flow: Two independent upstream chains converging on one label and one distribution channel.
    production_steps: Compounding through packaging at whichever partner site holds the campaign.
    release_pathway: R0, conventional, unchanged.
    inventory_policy: 'Supplier-held finished goods as a contractual term: site_fg_days base 90 and searched
      to 180, which brackets the documented terms (90 to 120 days at HealthTrust SIMS, F10-S08; 3 to 6
      months of API and finished dose at Premier ProvideGx, F10-S07; up to 6 months at Vizient NES Reserve,
      F10-S05). material_target_days 90 represents the contractual API and component reserve. Regional
      base-stock review is on, which Phase A identifies as the single largest artifact-free inventory
      lever (MD-3).'
    allocation_policy: 'minimum_guarantee is declared because that is the contract, and it is recorded
      here as inert in the engine: strategies.py pins criticality_weight at 1.0 for every region and simulation.py
      never passes a minimum guarantee to allocate(), so all four allocation policies collapse to proportional.
      The declared value documents the contract, not a modelled mechanism.'
    customer: Member health systems, contracting through a GPO or directly.
    revenue_mechanism: 'Unit price on committed volume, with a failure-to-supply penalty running the other
      way. Jia and Zhao''s result is the only quantified one available and it is conditional: a 30 percent
      price increase paired with strengthened failure-to-supply clauses gives 25 percent minimum, 53 percent
      average and 70 percent maximum shortage reduction across their tested scenarios (F10-S33). The 30
      percent must travel with the effect size and is not assumed here.'
    contracting_requirement: 'Committed volume plus enforceable failure-to-supply plus mandated source
      distinctness. The Senate Finance discussion draft is the most detailed available design and requires
      a separately contracted secondary supplier with API and component sources distinct from the primary
      supplier''s (F10-S11). HHS records that erosion of failure-to-supply clauses in GPO contracts may
      be associated with drug shortages (F10-S10). committed_units_per_year and price_required_usd_per_unit
      are None and reported by missing(): the penalty magnitude and the price are undisclosed for every
      private program (F10 section 9 item 4).'
    capital_requirement: None owned by Telo. The engine charges the network's capital and fixed cost for
      both sites; that is a ledger convention and not a claim about who pays.
    implementation_lead_time: 545 days to second_source producing, illustrative, inside the declared second_source_qualification_days
      range and off 365 on purpose (MD-17). Qualifying a second container source may run longer than qualifying
      a second API source and the engine cannot express the difference.
    regulatory_gates: *id001
    dominant_risks: 'Overlap with a family the review already rejected: upstream diversification as a
      standalone intervention does not survive prior art, so the whole claim rests on the contract being
      the instrument that forces it, and the run has to show that contract-mandated container independence
      changes the tail beyond what independent_api_supplier alone does at S2. Cost: two qualified container
      sources means two stability programs and two sets of container-closure integrity data, which the
      engine prices only through a blunt validation_factor. Compliance leakage as in every committed contract
      (F10-S09, F10-S15). No failure-to-supply penalty channel exists in the engine, so the outcome-based
      half of the contract is unmodelled while the source topology is measured. Commercially, a committed-contracting
      regime may reduce rather than increase the demand available to a new entrant (F10-S45, F10-S36).'
    potential_moat: The maintained dual-qualified package, which is adjacent to unoccupied intervention
      point 6.3 (a regulator-pre-agreed switching package under 21 CFR 314.70(e) and ICH Q12 PACMP). The
      prior-art review bounds that asset at about 30 days plus predictability rather than a step change,
      because FDA's carve-out caps the gain at CBE-30 and conditions even that on the receiving site's
      compliance state (F9-S37).
    falsification_test: 'Structural: run head to head against frozen S2 with independent_api_supplier
      = 1 at matched service after the R004 and R005 re-runs, then re-run with second_source moved back
      onto vial_1 (dropping cc_vial_2). If the tail probability does not move by more than the binomial
      standard error on p_meet that MD-16 now reports, contract-mandated container independence buys nothing
      measurable and the architecture collapses into S2 with extra validation cost. A second ablation
      drops the supplier-held buffer (site_fg_days to 30, material_target_days to 60) to separate the
      source-independence effect from the inventory effect. Commercial: the only quantified failure-to-supply
      result is conditional on a 30 percent price increase travelling with it (F10-S33), so the architecture
      is falsified commercially if no purchaser will pay that increase.'
  notes: 'PRELIMINARY / ILLUSTRATIVE. Tier-5 numbers, marked: second_source scale 1.0; commissioning_days
    545 (inside the declared second_source_qualification_days range, chosen off 365 because 365 equals
    warm_up_days and would show zero measured window loss, MD-17); vial_2 lead_time_factor 0.5 (the same
    component_lead_fraction convention the frozen builder uses, not evidence about a real second container
    supplier); site_fg_days 90 and material_target_days 90 chosen inside the documented supplier-held
    buffer range (F10-S05, F10-S07, F10-S08); fixed_cost_factor 1.05 and validation_factor 1.5 as placeholders
    for the second container source''s stability and container-closure work, with no evidence behind either
    figure. central scale 1.05 is STATUS_QUO_SCALE. Common-cause groups declared honestly, including cc_label_owner
    on both sites because one label, one NDC and one supplier-qualification function fail together (LNPM-S22);
    stopper_1 is shared by both sites and is not claimed as independent. allocation_policy minimum_guarantee
    is documented as inert in the engine. Configured from candidate key dual_committed_supply_distinct_sources
    (judge tally 9.27, 3 keeps). VERIFICATION PASS 2026-09-03 (revision R007): cc_stopper_1 and cc_geo_<region>
    are now declared on every site plan under convention NEW-4 in this file''s header, so this design''s
    group count changed and every run of it made before 2026-09-03 is superseded. S0-S7 carry neither
    group, so any comparison against them must either give them the same groups or report the gap, and
    the labelled matched-membership control (same group count, split membership) has to be run before
    the added Poisson hazard is read as an added correlation. quality_owner was expanded on 2026-09-03
    to state who dispositions and why no cc_quality group is declared: each partner holds its own ANDA,
    so 21 CFR 211.22(a) places disposition with two different holders and no single quality unit spans
    the two sites. That reasoning lived in regulatory_owner and was never connected to the group decision.
    The stopper leg is now represented by cc_stopper_1 on both sites; the falsification test (''re-run
    with second_source moved back onto vial_1'') was not interpretable while the shared container-closure
    hazard was absent from the model rather than merely declared in prose. Matched-membership control
    for the newly declared cc_stopper_1, run first here because this design''s falsification test was
    uninterpretable while the stopper leg was absent from the model: with the group shared across both
    sites, fill is 0.98711 (MCSE 0.00289) and p_meet 0.52; with the same group count and split membership
    (second_source moved to cc_stopper_2) it is 0.98721 (MCSE 0.00288) and p_meet 0.52. The difference
    is -0.00009, inside MCSE, so at the frozen hazard rate the container-closure correlation is represented
    but not load-bearing, and the added Poisson hazard rather than the added correlation accounts for
    whatever moved. verification-pass paired run, post-R007 configuration, sodium bicarbonate, master
    seed 20260901, n = 25, horizon 2191 d after a 365 d warm-up, no manifest; it is model behaviour and
    must be re-run inside the Phase D battery before it is quoted.'
- id: S19
  name: Maintained alternate-source switching package with an exercised standby line
  pathway: approved_cmo
  durable: true
  family: upstream_first
  release_scenario: R0
  allocation_policy: proportional
  design_variables:
    capacity_factor: 1.05
    safety_stock_days: 60.0
    site_fg_days: 30.0
    material_target_days: 90.0
    material_reorder_days: 14.0
    delivery_days: 4.0
    component_lead_fraction: 0.5
    region_base_stock: 1.0
    activation_threshold_days: 60.0
    campaign_batches: 3.0
    take_or_pay_fraction: 0.0
    reserved_site_owned: 0.0
    emergency_transfers: 1.0
  site_plans:
  - id: central
    region_id: R1
    archetype: central
    scale: 1.0
    exists_at_t0: true
    api_supplier: api_src_a
    vial_supplier: vial_1
    stopper_supplier: stopper_1
    serves: all
    groups:
    - cc_api_1
    - cc_vial_1
    - cc_geo_R1
    - cc_ksm_api_1
    - cc_stopper_1
    - cc_quality
  - id: second_source
    region_id: R3
    archetype: cdmo_reserved
    scale: 1.0
    exists_at_t0: true
    reserved: true
    api_supplier: api_src_b
    vial_supplier: vial_1
    stopper_supplier: stopper_1
    serves: all
    exercise_batches_per_year: 2.0
    activation_failure_probability: 0.15
    activation_lead_days: 386.0
    groups:
    - cc_api_2
    - cc_vial_1
    - cc_ksm_api_1
    - cc_stopper_1
    - cc_quality
    - cc_geo_R3
  extra_suppliers:
  - id: api_src_a
    name: incumbent API supplier
    component_ids:
    - api
    lead_time_factor: 1.0
    groups:
    - cc_api_1
    - cc_ksm_api_1
  - id: api_src_b
    name: alternate qualified API supplier drawing the same key starting material
    component_ids:
    - api
    lead_time_factor: 1.0
    groups:
    - cc_api_2
    - cc_ksm_api_1
  design_space:
  - name: safety_stock_days
    low: 30.0
    high: 365.0
    kind: float
    grid: 5
  - name: material_target_days
    low: 30.0
    high: 365.0
    kind: float
    grid: 5
  - name: activation_threshold_days
    low: 10.0
    high: 180.0
    kind: float
    grid: 4
  - name: region_base_stock
    low: 0.0
    high: 1.0
    kind: int
    grid: 2
  profile:
    family: upstream_first
    product_archetype: One shortage-prone multi-source generic sterile injectable in an ISO-format vial,
      aseptically filled, released on the conventional compendial vector with the 14-day sterility incubation
      dominant. The candidate is indifferent to sterilization route, so it composes with family 11 route
      conversion rather than competing with it.
    asset_ownership: Telo owns no plant. The incumbent finished-dose site belongs to the application holder.
      The alternate line belongs to a third party and is held under a reservation agreement, so reserved_site_owned
      = 0 and only the reservation fee plus the cost of batches actually run reaches Telo (R004, MD-14).
    sites_summary: Two registered sites, both existing at t0. central (R1, incumbent, scale 1.0 x capacity_factor
      1.05, which equals STATUS_QUO_SCALE so no capacity_expansion_days wait applies). second_source (R3,
      archetype cdmo_reserved, reserved, scale 1.0, idle until activated, two exercise batches per year,
      activation lead 386 days in the base world).
    regulatory_owner: The ANDA holder. Telo holds no application. The switching package is filed by the
      holder as a comparability protocol under 21 CFR 314.70(e), synonymous with an ICH Q12 PACMP (F9-S8,
      F9-S13, F9-S37). Telo prepares and maintains it and the validation data behind it. Gate G07 governs
      and stays UNCERTAIN.
    quality_owner: Each site keeps a resident quality unit, but batch disposition for both sites sits
      with the application holder's quality unit under 21 CFR 211.22(a), which a quality agreement cannot
      delegate (21 CFR 211.22(a) (F3-S42), 21 CFR 200.10(b) treating extramural facilities as an extension
      of the manufacturer (F3-S43), and FDA quality-agreements guidance stating that a quality agreement
      cannot delegate CGMP responsibility (F3-S41)). Telo holds no disposition authority; whether Telo
      holds it is irrelevant to whether the two sites share one quality unit, and this design says they
      do, so cc_quality spans both. The declared value of this architecture is entirely a tail effect,
      and an unmodelled shared disposition function is exactly a tail correlation.
    supplier_graph: 'Two API suppliers, api_src_a and api_src_b, each at the product''s material_lead_time_days.
      They sit in distinct API groups cc_api_1 and cc_api_2 and in one shared upstream group cc_ksm_api_1
      together with both sites, because USP reports 58 percent of key starting materials sole sourced
      from a single country, 41 percent from China, and states that diverse API or finished-dose manufacturing
      offers little protection when all depend on the same upstream source (F9-S5, F9-S7). Both sites
      use vial_1 and stopper_1 and therefore share cc_vial_1: ISO container format is the incumbent state,
      not a differentiator (F9-S21, F5-S36).'
    material_flow: API and components ship to whichever site is running. No intermediate is transferred
      between sites, so there is no bulk hold time and none of the family 5 or family 4 hold-time questions
      arise. Each site holds its own material store at material_target_days of cover.
    production_steps: Compounding, sterile filtration, aseptic fill, inspection and packaging, all at
      one site per batch. No step is split.
    release_pathway: R0 conventional. Sterility incubation, environmental monitoring, endotoxin, assay
      and serial QA review at the producing site. This candidate changes no release component and gate
      G15 is out of scope.
    inventory_policy: Regional order-up-to with daily base-stock review (region_base_stock = 1, the MD-3
      opt-in that the frozen S0-S7 rule forbids). safety_stock_days 60 plus lane time, site finished-goods
      target 30 days, material order-up-to 90 days which is one API lead time for both current products,
      with a 14-day reorder point.
    allocation_policy: proportional. criticality_weighted is admitted by the schema but is inert, because
      build_strategy sets every region's criticality_weight to 1.0 and configuration cannot change it.
    customer: 'Named but unfunded. Either the ANDA holder carrying 506C failure-to-supply exposure, or
      a purchaser consortium (GPO, health system, state or federal buyer). No such buyer was found: Civica''s
      2023 Senate testimony asks Congress for grants to create reserve US finished-dose capacity, which
      is evidence none exists (F3-S28), and no commercial capacity-reservation product for a non-government
      buyer was located (LCDM-S14).'
    revenue_mechanism: 'A standing fee for keeping the alternate source current, plus an execution fee
      on activated campaigns. Not a unit margin, and not reimbursement: CMS buffer payment reaches only
      hospitals of 100 beds or fewer not in a chain and is a payment to hospitals, not a manufacturing
      cost (LSD-S3).'
    contracting_requirement: ContractTerms(mechanism='capacity_subscription') can answer beneficiary,
      activation_condition (network days of supply below activation_threshold_days, or a 506C supply-interruption
      notification), allocation_rights and default_risk (the alternate site is not in an acceptable CGMP
      state at implementation, F9-S37). Run against the live class, missing() returns payer, purchaser,
      term_years, committed_units_per_year and price_required_usd_per_unit. Five of nine required terms
      are unanswered, so this architecture is NOT contractable today and must be reported as such.
    capital_requirement: Near zero for Telo. Recurring cost is reserved_capacity_fee_fraction (base 0.3)
      of the alternate line's notional annualised fixed plus capital cost, the variable and testing cost
      of two exercise batches a year, and the regulatory and validation work behind the package. The engine's
      reported annual_total_cost is network cost including the incumbent's plant, not Telo's ledger; the
      Telo-only variant sets capital_multiplier, fixed_cost_multiplier and validation_multiplier to 0.0
      on central and must be run as a labelled companion.
    implementation_lead_time: Unpriced by any engine parameter. GDUFA III commits FDA to act on a standard
      prior approval supplement within 6 months without a preapproval inspection and 10 months with one,
      and a facility not in the original ANDA defaults to the inspection path (F9-S11, F9-S12). Treat
      12 to 24 months to a maintained package as an assumption, not evidence.
    regulatory_gates: *id001
    dominant_risks: 'No payer (F3-S28, LCDM-S14). Gate G07 UNCERTAIN and the comparability-protocol gain
      capped at CBE-30 rather than CBE-0, conditional on the receiving site''s compliance state at implementation
      (F9-S37). The alternate site''s compliance state is a moving target: FDA told Jubilant the same
      aseptic simulation deficiency was cited in 2023 and 2024, and Leiters'' 110,000 sq ft plant was
      still not inspected 4.2 years after purchase (LCDM-S7, L503B-S21). It does nothing for chronic capacity
      shortfall. Exercise batches must be sold or scrapped, and Warstopper manufacturers refused to hold
      volumes they might not sell (F7-S07, F10-S25).'
    potential_moat: 'The maintained package plus the validation data the receiving quality unit needs
      under 21 CFR 211.84 and 211.94, which is a data artifact rather than a document (F9-S9, F9-S10),
      replicated across several ANDA holders. Weak in three ways: FDA publishes no approved comparability
      protocols so the asset cannot be marketed by precedent, the gain is capped at CBE-30 (F9-S37), and
      ASPR has already named and funded the registry concept through the DS-MRN challenge (LGOV-S17, LGOV-S51).'
    falsification_test: 'Run three paired designs identical except for second_source.activation_lead_days
      at 386, 201 and 51 days, each the sum of a regulatory clock and the engine''s reserved_capacity_activation_days
      base of 21 (365 = second_source_qualification_days base; 180 = the GDUFA III standard PAS clock
      without an inspection, F9-S11; 30 = CBE-30 under an approved comparability protocol, F9-S37). If
      the difference in p_meet at the frozen tail requirement is inside its binomial standard error at
      the run count used, the switching package is worth nothing in this model and the architecture dies.
      Secondary: split cc_ksm_api_1 into two groups with the same group count and different membership;
      if service is unchanged, the honest upstream correlation is not load-bearing. Tertiary, external
      and decisive for novelty: a single published comparability protocol pre-authorising an alternate
      aseptic site or API supplier for a generic sterile injectable moves the classification to already_implemented.'
  notes: 'PRELIMINARY / ILLUSTRATIVE / NOT FOR EXTERNAL CLAIMS. Every input is tier 5. capacity_factor
    1.05 is STATUS_QUO_SCALE, chosen so the incumbent plant carries no MD-7 expansion wait; safety_stock_days
    60, delivery_days 4 and region R3 reproduce the frozen S2 illustrative design; material_target_days
    90 is one product material_lead_time_days; material_reorder_days 14, site_fg_days 30, campaign_batches
    3 and component_lead_fraction 0.5 are engine defaults; activation_threshold_days 60 is set equal to
    safety_stock_days as a rule rather than a new value; exercise_batches_per_year 2.0 is the twice-yearly
    line requalification cadence in Annex 1 and FDA 2004 section IX (F7-S12, F7-S13), used here as a product-batch
    cadence, which is an extrapolation; activation_lead_days 386 = second_source_qualification_days base
    365 plus reserved_capacity_activation_days base 21. activation_failure_probability 0.15 is INVENTED,
    has no evidence behind it, and must be swept at 0.0, 0.15 and 0.5 as a labelled scenario. The base
    design deliberately assumes NO approved comparability protocol, because gate G07 is UNCERTAIN and
    the protocol forbids assuming regulatory approval; the pre-agreed world is the labelled optimistic
    variant, and the difference between them is this strategy''s entire value. region_base_stock = 1 departs
    from the frozen review rule (MD-3), so any comparison against S0-S7 must either give them the same
    rule or report the difference. Configured from candidate key upstream_switching_package (judge tally
    9.16, 2 keeps). VERIFICATION PASS 2026-09-03 (revision R007): cc_stopper_1 and cc_geo_<region> are
    now declared on every site plan under convention NEW-4 in this file''s header, so this design''s group
    count changed and every run of it made before 2026-09-03 is superseded. S0-S7 carry neither group,
    so any comparison against them must either give them the same groups or report the gap, and the labelled
    matched-membership control (same group count, split membership) has to be run before the added Poisson
    hazard is read as an added correlation. Three items recorded on 2026-09-03. (1) cc_quality is now
    declared on both sites. Whether Telo holds disposition authority is irrelevant to whether the two
    sites share one quality unit, and this design''s own quality_owner says they do; the value claimed
    here is entirely a tail effect and an unmodelled shared disposition function is exactly a tail correlation,
    so the three paired activation_lead_days designs (386 / 201 / 51) must be re-run with the group present.
    (2) MD-19: the supplier arm of a common-cause group was structurally inert until 2026-09-03 and now
    stretches delivery in proportion to the shortfall; at the frozen hazard rate the shared-key-starting-material
    test still returns a null, which is a property of slack and the hazard rate rather than of the gate.
    (3) Gate G16 (component and container-closure lot qualification under 21 CFR 211.84 and 211.94, plus
    the Type II DMF letter of authorisation the alternate API source must issue, F9-S12) was added to
    config/regulatory_gates.yaml on 2026-09-03 and applies to S9, S18 and S19; it is UNCERTAIN like every
    other gate. Re-run with cc_quality present, as the blocker required: the three paired activation_lead_days
    designs give fill 0.79513 (MCSE 0.00794) and p_meet 0.00 at 386 d, 0.83225 (MCSE 0.00784) and p_meet
    0.00 at 201 d, and 0.97695 (MCSE 0.00566) and p_meet 0.44 at 51 d. The switching package is worth
    nothing at the 180-day GDUFA III clock and is worth 0.44 of the tail requirement only at the CBE-30
    lead that an approved comparability protocol would buy (F9-S37), which is exactly the regulatory reading
    gate G07 leaves UNCERTAIN. verification-pass paired run, post-R007 configuration, sodium bicarbonate,
    master seed 20260901, n = 25, horizon 2191 d after a 365 d warm-up, no manifest; it is model behaviour
    and must be re-run inside the Phase D battery before it is quoted.'
