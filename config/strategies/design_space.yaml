      charge), which flatters this design more than any other in the battery.'
    potential_moat: 'Least defensible of the three on paper: inventory can be copied by anyone with working
      capital, and Civica already runs the contracted-supply plus buffer combination (F3-S25, F3-S30).
      What is not copied is the third leg, a rotated multi-site option that keeps a second and third filed
      site current (prior-art review 6.3 and 6.4). If the ablation shows that third leg carries weight,
      the moat is there and nowhere else.'
    falsification_test: 'Ablate the three legs one at a time on the post-R004/R005 battery, matched design
      variables, both products. If removing the rotated reserved surge leaves p_meet inside its binomial
      standard error, the family''s distinctive leg does nothing and this candidate collapses into frozen
