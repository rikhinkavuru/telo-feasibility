      a public filing describes a US CDMO agreement with annual committed capacity obligations on the
      CDMO and no minimum purchase obligation on the customer (LCDM-S14). ContractTerms is incomplete:
      price_required_usd_per_unit and default_risk have no evidence, so this candidate is recorded as
      not contractable, stated.'
    capital_requirement: 'No plant capital by construction. Working capital for inventory, plus technical
      transfer, process and cleaning validation and method transfer at two partner sites, plus Telo''s
      own quality unit. Warning about the model rather than the world: as declared, the partner sites
      still carry the product per-site capital and fixed cost, because in this engine ownership is a property
      of the reserved flag and not of the site (MD-14 residual).'
    implementation_lead_time: 'Day 0 for the incumbent line, 365 days for the CBE-30-class partner, 730
      days for the prior-approval-supplement partner. Both leads are existing tier-5 globals (second_source_qualification_days,
      node_commissioning_days) and neither is elicited evidence. MD-17 is open: 365 coincides with warm_up_days,
      so a 365-day lead currently costs 0 percent of the measured window and the CBE-30 partner reads
      as free.'
    regulatory_gates: *id001
    dominant_risks: '1. No purchaser has ever paid a premium for this and Civica asked Congress for grants
      or forgivable loans to create reserve finished-dose capacity (F3-S28). 2. Partner ownership changes
      inside a contract life: three of four BARDA FFMN awardees changed owner (F3-S67, F3-S68, F3-S70)
      and Baxter BioPharma Solutions became Simtra in 2023 (F3-S71), so the common-cause keying has to
      be re-done on parent company and re-checked. 3. Merchant US aseptic capacity is shrinking as sites
      go captive (LCDM-S1, LCDM-S9) and no US CDMO markets a shortage product. 4. Partner compliance state
      is persistent and survives ownership change (LCDM-S7, LCDM-S2), so a site prequalified once is a
      moving target. 5. Channel conflict where the partner sells capacity inside its own plant and competes
      in injectables (LCDM-S19). 6. Civica proved the demand side and then built its own plant, citing
      contamination control (F3-S25, F3-S31).'
    potential_moat: 'The maintained, filed, inspection-current site-product pairing: transfer packages,
      validated methods and an agreed change-control category at more than one aseptic site for the same
      generic. No published example was found for a generic sterile injectable (prior-art review 6.3;
      F9-S37). It is a thin moat: FDA''s own carve-out caps the gain at CBE-30 rather than CBE-0 and cannot
      pre-clear the receiving site''s inspection status at protocol time (F3-S46).'
    falsification_test: 'Model test: run this candidate against frozen S2 (dual source, the only strategy
      that cleared at tau 0.98 pre-R004) on the post-R004/R005 battery under matched design variables.
      If it does not reach S2''s p_meet at a lower annual cost for both products, it adds nothing over
      dual sourcing and is dropped. Evidence test, outside the model: if no candidate US partner already
      fills a similar approved presentation in the same container type with a satisfactory CGMP inspection
      for that operation, every site-product pair is a prior-approval supplement with a possible pre-approval
      inspection (F3-S45 VI.A, VI.B.1, VI.B.2, VI.B.4) and the 365-day leg does not exist, which removes
      the family''s central advantage over building.'
  notes: 'PRELIMINARY / ILLUSTRATIVE / NOT FOR EXTERNAL CLAIMS. Every number is tier 5. Illustrative:
    partner scales 0.30 and 0.20, chosen so the two partner slots are 13.5 and 9.0 batch slots per year,
    a range consistent with the only public per-site figure found, 104 product batches per year at peak
    utilization rising to over 240 at one dedicated US fill-finish site (LCDM-S15); commissioning_days
