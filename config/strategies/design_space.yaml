  profile:
    family: inventory_capacity_hybrids
    product_archetype: 'Aqueous small-molecule sterile injectable in a single-dose glass vial, currently
      or recurrently on the FDA shortage list, released conventionally. The two dossier products behave
      differently: sodium bicarbonate is capacity-short by construction, norepinephrine capacity-adequate
      and tail-limited. Sterilization route is not carried by the engine and is unknown for both (prior-art
      review section 7 item 11).'
    asset_ownership: 'Telo owns no manufacturing asset. The incumbent line is the existing registered
      plant at the status-quo scale 1.05, so nothing is expanded and no capacity_expansion_days clock
      runs (R004). Two campaign slots are bought on registered third-party lines and are not owned (reserved_site_owned
      = 0). DLA states the same preference for its own readiness stock: the preference is to buy guaranteed
      access to material rather than to purchase or own material outright (F10-S24).'
    sites_summary: Three sites. central (R1, exists at t0, scale 1.05, serves all regions). reserved_cdmo
      (R2) and reserved_cdmo_b (R3), each scale 0.6, contracted not owned, available only after a 540-day
      qualification lead, exercised twice per line-year, activation failure probability 0.10, activation
      lead from the global reserved_capacity_activation_days (base 21 days). All scales and leads illustrative.
    regulatory_owner: The ANDA holder, whether that is Telo or a partner; each contracted line has to
      be named in the application before it can make commercial product (G01, G02, G07). All three are
      UNCERTAIN, so the 540-day lead is a placeholder for a regulatory duration nobody has confirmed,
      not an approval.
    quality_owner: One quality unit performs batch disposition for every site under one application, which
      is why every site carries cc_quality; a data-integrity or quality-system failure at the disposition
      function stops release from all three lines at once. Each CDMO retains its own site quality system
      and inspection history, which Telo does not control.
    supplier_graph: 'api_1, vial_1 and stopper_1 for all three sites. This is the deliberate base case:
      buying capacity does not buy supplier independence, so the whole network sits inside cc_api_1, cc_vial_1
      and cc_stopper_1 and a single upstream event removes every line. cc_os is deliberately absent: the
      activation trigger is a contractual decision rule on days of supply executed by people, not a shared
      software or model version at the sites.'
    material_flow: API, vial and stopper to each site under one material policy. Finished goods flow from
      any site to any region, 1 day inside a region and delivery_days 4 across regions, with emergency
      lanes at emergency_transport_days (base 1 day), which is inside the 24 to 36 hour delivery the SNS
      vendor-managed inventory contracts document (F8-S03).
    production_steps: Compounding, sterile filtration and aseptic fill, inspection, testing and disposition
      happen at one site per batch. No step is split between sites, so the family 4 bulk hold question
      and the EMA 24-hour refiltration expectation do not arise.
    release_pathway: Conventional release, scenario R0, with the frozen release-component vector. No release
      component is reduced; G15 is not invoked; no release-assurance or parametric claim is made. Phase
      A records release time as not binding, so nothing is spent on it here.
    inventory_policy: 'Regional order-up-to at safety_stock_days plus lane days, with region_base_stock
      choosing between daily base-stock review and the frozen (s, S) rule that Phase A calls decisive
      in 8 of 16 cells and an artifact (MD-3). Site finished-goods target 30 days. FEFO issue and explicit
      lot expiry are in the engine, so reserve depth pays a measured expiry cost rather than an assumed
      scrap fraction; 21 CFR 211.150(a) requires oldest-stock-first distribution (F8-S21). Shelf-life
      extension is not available: SLEP remains limited to federal stockpiles (F8-S20).'
    allocation_policy: 'proportional in the engine. The contract''s minimum-guarantee allocation right
      is not simulable today: allocation.allocate accepts a minimum_guarantee vector but simulation.py
      never passes one and build_strategy fixes every region''s criticality weight at 1.0, so minimum_guarantee
      and criticality_weighted both degenerate to proportional. Declaring anything else would misreport
      the run.'
    customer: Hospital systems and the group purchasing organisations that contract for them. Three GPOs
      cover more than 90 percent of US hospitals and Vizient alone serves more than 65 percent of acute-care
      providers (LSIM-S20, LSD-S11), so the channel is the customer whether or not Telo would prefer to
      sell around it.
    revenue_mechanism: 'Unit price under a committed-volume contract in the shape Civica documents: members
      commit about 50 percent of expected volume for three to ten years at one price with guaranteed delivery
      (F8-S14, F10-S01). No availability payment, no separate resilience premium and no CMS buffer payment
      is assumed, because none of those is available to a manufacturer for this product.'
    contracting_requirement: 'Take-or-pay on the reserved lines (take_or_pay_fraction 0.5, illustrative)
      is what pays for readiness, and it is chosen precisely because committed volume is documented while
      a standing reservation fee is not: no US hospital system, GPO or state was found to have paid one
      (F3-S28, open question 17). ContractTerms, filled with shapes taken from other people''s contracts
      and not from any counterparty of Telo''s: payer = the member hospital through the unit price; purchaser
      = the health system or GPO; beneficiary = member hospitals'' patients; term_years = 3 to 10 (F8-S14);
      committed volume = about 50 percent of expected volume; activation_condition = network days of supply
      below activation_threshold_days; allocation_rights = proportional, with the minimum guarantee unsimulable;
      default_risk = failure-to-supply clause erosion and low-price walk-away in GPO contracts (F10-S10);
      price_required = a model output. Nothing is signed, so ContractTerms.missing() is not empty and
      this architecture is recorded as not contractable.'
    capital_requirement: 'No plant capital at the contracted lines. The real capital is one-time qualification
      and technical transfer at each contracted line plus working capital for the reserve, carried at
      inventory_carrying_rate (base 0.20 per year, the same figure CMS assumed for its buffer-stock spending
      estimate, F8-S18, an anchor and not a validation). The engine charges a reserved line zero validation
      cost, which understates this architecture: Emergent''s published reservation fee does not include
      tech transfer, process and analytical development, process development, raw materials and lot release
      testing of a batch (F7-S04). In the other direction, the engine charges the incumbent central site''s
      full capital, fixed operations and validation to this network''s ledger, because ownership is a
      property of the reserved flag and not of the site (MD-14 residual); that is a ledger convention,
      not a claim about who pays, and it must be corrected before any cost ranking is quoted. A Telo-only
      ledger needs a labelled companion design with capital_multiplier, fixed_cost_multiplier and validation_multiplier
      set to 0.0 on central.'
    implementation_lead_time: 540 days per contracted line before it can make commercial product (illustrative,
      chosen between the 365-day low and the 730-day base of second_source_qualification_days and deliberately
      not 365, which equals warm_up_days and would make the lead invisible, MD-17), plus the G02 and G07
      submission and inspection lead, which is UNCERTAIN. Once qualified, the activation lead is the global
      21 days rather than the 730-day node commissioning, which is the whole point of buying registered
      capacity rather than building it.
    regulatory_gates: *id001
    dominant_risks: '(1) The line does not deliver when called. GAO found the CIADM sites underused before
      COVID-19, that a lack of regular manufacturing work prevented the sites from developing the capability
      to rapidly produce countermeasures at large scale, that one site was terminated after cross-contamination
      and that none met the surge goal (F8-S09). (2) Nameplate reserved capacity is not delivered capacity:
      the campaign duty cycle plus the 21-day activation lead plus the 540-day qualification lead cut
      1.2 nominal plants of contracted capacity down to a small fraction in the measured window. (3) Readiness
      cost is understated by the engine and by the market (F7-S04). (4) One API group and one vial group
      span every line. (5) Take-or-pay is paid in quiet years. (6) No purchaser has ever been shown to
      pay for readiness in this market (F3-S28), and FDA''s own Drug Shortages Task Force records that
      most generic manufacturers cannot afford to support redundant capacity (F7-S16).'
    potential_moat: 'Maintained qualification packages plus exercised campaign slots across independently
      owned lines, which the prior-art review records as unoccupied in two places: campaign rotation as
      a scheduling policy (6.4) and manufacturer-side capacity coordination across independent owners
      (6.6). The moat is weak and should be described as weak: it is contractual rather than technical,
      a GPO can write the same contract, and the GPOs already own the channel. Section 6.6 also records
      that coordination across independent owners is an antitrust question before it is a product (F2-S63,
      F2-S64).'
    falsification_test: 'In the model, after the R004 and R005 re-runs: if this architecture at its best
      searched design does not beat frozen S3 on p_meet by more than two binomial standard errors at matched
      annual cost, the trigger-plus-exercise coupling adds nothing and the architecture collapses to S3.
      A second, sharper test: set exercise_batches_per_year to 0 and re-run; if service and cost are unchanged
      except for the removed exercise output, the readiness claim is untestable in the engine as it stands.
      In the world: a GPO, nonprofit or government contract in which reserve depletion below a stated
      threshold triggers a pre-qualified campaign at a named site would move the sub-idea from novel_combination
      to already_implemented (F8 section 7, row 5).'
  notes: 'PRELIMINARY / ILLUSTRATIVE / NOT FOR EXTERNAL CLAIMS; no number here is evidence. Site scales
    1.05 / 0.6 / 0.6, exercise cadence 2 per line-year, activation_failure_probability 0.10, take_or_pay_fraction
    0.5 and the 540-day qualification lead are illustrative. 540 was chosen instead of the 365-day base
    of second_source_qualification_days because 365 equals warm_up_days, so a 365-day lead is invisible
    in the measured window (MD-17); this candidate is one of three in the battery that deliberately dodged
    that boundary. Exercise cadence 2 per year is the Annex 1 aseptic process simulation cadence (F7-S13);
    GAO''s CIADM finding argues for more (F8-S09). The reserved lines carry no capital, fixed operations
    or validation on Telo''s ledger (R004, MD-14); that understates cost, because a reservation fee excludes
    tech transfer, process and analytical development and lot release testing (F7-S04). Two different
    CDMO owners are assumed, so no shared cc_cdmo group is declared; if both slots sit at one owner, add
    cc_cdmo_1 to both plans and re-run. take_or_pay_fraction is a contract instrument, not an optimisation
    target, and must be swept as a labelled contract scenario rather than minimised. KNOWN INERT MECHANISM:
    activation_failure_probability is a per-plan constant with no link to exercise cadence, so the readiness
    half of this design''s claim cannot be measured until a readiness-decay hazard exists. Configured
    from candidate key f8_reserve_triggered_campaign (judge tally 9.35, 2 keeps). VERIFICATION PASS 2026-09-03
    (revision R007): cc_stopper_1 and cc_geo_<region> are now declared on every site plan under convention
    NEW-4 in this file''s header, so this design''s group count changed and every run of it made before
    2026-09-03 is superseded. S0-S7 carry neither group, so any comparison against them must either give
    them the same groups or report the gap, and the labelled matched-membership control (same group count,
    split membership) has to be run before the added Poisson hazard is read as an added correlation. Three
    items recorded on 2026-09-03. (1) MD-23, measured: setting exercise_batches_per_year to 0 moves mean
    fill from 0.96830 (MCSE 0.00361) to 0.96667 (MCSE 0.00376) at n = 25 on sodium bicarbonate, with p_meet
    0.00 in both arms and 50.1 against 50.0 batches per year. The delta is inside its own MCSE, so this
    design''s readiness cadence has no run behind it on this engine. The cause is structural: `exercise_due`
    is blocked while a campaign is banked, and these lines are activated often, so a campaign batch substitutes
    for an exercise batch one for one. S17, whose lines are rarely activated, moves +0.01070 on the same
    ablation. (2) MD-21 fixed: the reservation fee and take-or-pay used to accrue from day zero, so about
    a quarter of this design''s contract cost was charged over the 540 days before either line could make
    commercial product; both now accrue only while the line exists. (3) cc_os is deliberately absent and
    supplier_graph now says so: the days-of-supply activation trigger is a contractual decision rule,
    not a shared software version at the sites.'
