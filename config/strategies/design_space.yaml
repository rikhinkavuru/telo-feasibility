      rather than as idle capacity.'
    sites_summary: Three sites. central in R1 at scale 1.05 is the incumbent line available on day 0.
      second_source in R3 at scale 0.30 is a firm contracted partner with independent API and container
      sources, available after 365 days. reserved_cdmo in R2 at scale 0.35 is a standing campaign option
