      that price. A separate readiness payment is needed only for the reserved line, which is the smallest
      of the three legs, so this candidate has the least exposure to the missing payer.
    contracting_requirement: 'Buyer side take-or-pay on committed volume; supply side a firm slot commitment
      at the second source and a reservation fee plus take-or-pay at the option site. The reserve is the
      leg a hospital buyer can actually be sold, because inventory is a purchase rather than a readiness
      payment, and Civica sells exactly that today (F3-S30). ContractTerms remains incomplete on price_required_usd_per_unit
