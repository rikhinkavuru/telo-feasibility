    material_flow: Independent procurement per site, finished product to four regions, reserve stock held
      regionally under a daily base-stock review rather than the frozen reorder rule. Material buffers
      are raised (target 90 days, reorder 21) as the upstream half of the reserve.
    production_steps: All manufacturing at partner sites. Telo runs transfer, the exercise schedule, the
      activation decision and the reserve policy. cc_os is deliberately absent because that control layer
      is a contractual decision rule executed by people, not a shared software or model version installed
      at the sites; the engine's cc_os group represents a common software or model version (see S12, which
      states the same absence, and S17, which declares cc_os because one Telo layer does span its sites).
    release_pathway: Conventional, R0, frozen release components, no rapid-micro and no parametric claim.
      Phase A already records that release time is not the binding constraint, so nothing here tries to
      compress it.
    inventory_policy: 'The distinctive leg. Regional base-stock review (region_base_stock 1) with safety_stock_days
      searched 30 to 365, site finished goods 60 days, material target 90 days. Phase A finding this is
      built on: capacity-adequate strategies fail only the tail, and the regional review rule plus the
      inventory level is what fixes the tail. The comparator value in the world is Civica''s six-month
      buffer target (F3-S30, F3-S25) and the six-month API reserve directed for the strategic reserve
      (F3-S35); both are comparator values, not Telo design values.'
    allocation_policy: Proportional, with the same stated engine limitation on allocation rights.
    customer: Hospital systems and GPOs buying vials under multi-year committed volume, which is also
      what pays for the reserve.
