    stopper_supplier: stopper_1
    pathway: approved_cmo
    serves: all
    groups:
    - cc_api_1
    - cc_vial_1
    - cc_cdmo_1
    - cc_geo_R3
    - cc_stopper_1
    - cc_quality
  extra_suppliers: []
  design_space:
  - name: site_fg_days
    low: 30.0
    high: 365.0
    kind: float
    grid: 4
  - name: safety_stock_days
    low: 15.0
    high: 365.0
    kind: float
    grid: 4
  - name: region_base_stock
    low: 0.0
    high: 1.0
    kind: int
    grid: 2
  - name: material_target_days
    low: 30.0
    high: 180.0
    kind: float
    grid: 3
  profile:
    family: postponement
    product_archetype: Aqueous small-molecule sterile injectable, one strength, ISO 8362-1 standard vial
      (F5-S36), terminally sterilizable or aseptically filled (route not disclosed on US or EU labels,
      prior-art review section 7 item 11), high unit volume, several labeler NDCs in the market. Both
      dossier products carry standard_vial true and are single-presentation, so both understate this family
      by construction (F5-S01, MD-15).
    asset_ownership: Telo owns no fill asset. The incumbent's registered line (central) is somebody else's
      plant already supplying the market. The offtake line (reserved_cdmo) is a registered CDMO aseptic
      line under a campaign supply agreement; reserved_site_owned = 0, so after R004 Telo carries only
      the reservation fee plus the variable and testing cost of the batches it buys. Telo owns the undifferentiated
      inventory, the labeling and packaging step, and the NDC.
    sites_summary: Two sites, both registered and producing at t0, so commissioning_days = 0 at both.
      central in R1 at the workbook status-quo scale 1.05 (no R004 expansion wait). reserved_cdmo in R3
      at scale 0.5 of the nominal line, reserved, running a standing campaign of 6 exercise batches per
      year and callable for campaign_batches more when regional days of supply fall below activation_threshold_days.
    regulatory_owner: The ANDA or NDA holder remains the application owner (G01). Telo is either that
      holder or its contract labeler and relabeler; 21 CFR 207.1 defines relabel and relabeler and folds
      contract packers and contract labelers into manufacturer, so Telo's finishing operation registers
      and lists in its own right (F5-S12). Whether Telo registers as relabeler or as contract manufacturer
      is UNCERTAIN (F5 section 5).
    quality_owner: Each site keeps its own quality unit under its own establishment registration (21 CFR
      Part 207), which is not the application. Both fill sites must be named in the one approved application
      to supply it, and batch disposition under that application is non-delegable (21 CFR 211.22(a) (F3-S42),
      21 CFR 200.10(b) treating extramural facilities as an extension of the manufacturer (F3-S43), and
      FDA quality-agreements guidance stating that a quality agreement cannot delegate CGMP responsibility
      (F3-S41)), so one quality unit disposes output from both and cc_quality is declared on both sites.
      No shared quality unit across legal entities is claimed, so the DME single-legal-entity constraint
      is not invoked. Telo's finishing operation runs its own quality unit for identification, labeling
      reconciliation, and second disposition under 21 CFR 211.130(b) and 211.122(d) and (g), using cap
      coding applied before hold as the 211.122(g)(4) automated technique (F5-S08, F5-S09, F5-S44, F5-S45).
    supplier_graph: 'One API source (api_1, group cc_api_1), one vial source (vial_1, group cc_vial_1),
      one stopper source (stopper_1, which carries no common-cause group in the frozen builder and therefore
      understates container correlation). Both sites draw all three, so cc_api_1 and cc_vial_1 span the
      whole network. That is declared, not hidden: upstream concentration is the mechanism this architecture
      does not touch.'
    material_flow: API, vials and stoppers to two registered fill lines; both lines fill into the common
      container and hold output as filled, capped, cap-coded, unlabeled units; the undifferentiated pool
      sits in site finished-goods stock (site_fg_days); units are labeled, packed and dispositioned on
      order and shipped to four regional stocking points, which hold thin stock reviewed daily to a base-stock
      target.
    production_steps: Compounding, sterile filtration or terminal sterilization, aseptic or terminal fill,
      stoppering, capping, unit-level cap coding, inspection, hold as bright stock, then labeling, cartoning,
      serialization and second disposition at the finishing step. Only the last block is Telo's own operation.
    release_pathway: Conventional release, R0. Every frozen release component is unchanged. Bright stock
      does not shorten any of them; the sterility clock starts at fill (F5-S53). Expiry runs from manufacture,
      not from labeling (21 CFR 211.137, WHO TRS 992 Annex 4), so the pool consumes shelf life (F5-S11,
      F5-S17). Stability samples must carry the same or representative label and adhesive (F5-S20).
    inventory_policy: Two echelons. The undifferentiated pool at the fill sites is the deep buffer (site_fg_days,
      searched 30 to 365). The regional tier is thin (safety_stock_days, searched 15 to 365) and is reviewed
      daily to a base-stock target when region_base_stock = 1; the frozen legacy reorder rule is the other
      value of that search variable so the MD-3 artifact is separable from the architecture.
    allocation_policy: Proportional across regions in the engine. The commercial content of postponement
      is that the pool is uncommitted until finished, so an allocation decision can be made after demand
      is observed; the engine has no labeler dimension and no reallocation event, so that content is not
      represented (F5 section 8, MD-15).
    customer: 'Hospitals and health systems through a GPO or wholesaler contract for finished labeled
      vials. Not a readiness payer: this architecture deliberately does not require anyone to fund standby.'
    revenue_mechanism: Unit price on finished labeled vials sold under Telo's NDC. No availability payment,
      no resilience premium, so the four counsel questions that gate readiness payments are not on the
      critical path (prior-art review section 7 item 9).
    contracting_requirement: A bright-stock campaign supply agreement with the CDMO. mechanism = take_or_pay;
      payer = the hospital or GPO buying finished vials; purchaser = Telo (buying campaign capacity);
      beneficiary = the health system; term_years unknown, since no public rate card exists in this sector
      (landscape cdmos section 6); committed_units_per_year is a model output; activation_condition =
      regional days of supply below activation_threshold_days; allocation_rights = Telo allocates the
      pool; default_risk = the CDMO declines or fails a campaign, and Telo defaults on the take-or-pay
      in quiet years; price_required is a model output. Two of the nine fields have no evidence behind
      them, so ContractTerms.missing() is non-empty and the architecture is not yet contractable, stated.
    capital_requirement: 'No fill capital. Capital is the finishing operation: cap coding, vision inspection,
      labeling and cartoning lines, serialization, warehouse and quality unit. The engine has no parameter
      for a finishing site, so this cost is outside the model and must not be reported as zero. Working
      capital is the pool itself, at inventory_carrying_rate against unlabeled unit value, which is lower
      than finished-goods value (F5-S02).'
    implementation_lead_time: Both fill sites exist at t0, so the engine charges zero commissioning. The
      real lead times are the CDMO campaign contract, the technical transfer for the bright-stock presentation,
      and the labeling-site change. FDA's 2004 guidance places a move to a different manufacturing site
      for labeling and for secondary packaging among minor changes provided the site has a satisfactory
      CGMP inspection for that operation, against CBE-30 or a prior approval supplement for primary packaging
      or aseptic processing (F5-S14). The model has no labeling_site_change_days parameter.
    regulatory_gates: *id001
    dominant_risks: '(1) Content-to-label mismatch on held unlabeled stock, the documented failure mode
      of bright stock: Bayer recalled two lots after unlabeled Jivi 3000 IU vials were labeled as Kogenate
      FS 2000 IU (F5-S48) and Viatris recalled insulin glargine for a potentially missing label (F5-S49).
      (2) The engine will credit this architecture mainly for added capacity, not for postponement, because
      the offtake line adds about 48 percent to a plant that is over-utilized by construction; see the
      falsification test. (3) No CDMO is known to sell filled-unlabeled units as bright stock to a third
      party for US shortage generics (F5 section 9). (4) cc_api_1 and cc_vial_1 span both sites. (5) The
      5-day finish penalty is a single rare-disease-injectable data point (F5-S06) extrapolated to a generic.
      (6) Take-or-pay in quiet years is a real cash cost with no revenue against it.'
    potential_moat: Weak on technology, since late labeling is codified practice since 1978 (F5-S08) and
      is sold as a service by PCI and Sharp (F5-S46, F5-S47). The defensible asset, if any, is the standing
      campaign contract plus the transferred bright-stock presentation and the finishing and NDC infrastructure,
      which together let Telo buy registered capacity on demand without a fill-site supplement. That is
      a contracting position, not a technical one, and it is copyable by any labeler with a CDMO relationship.
    falsification_test: 'Run a capacity-matched control with the same reserved_cdmo line and the same
      exercise cadence, but with site_fg_days at its low bound, safety_stock_days high, delivery_days
      5 (no finish penalty) and region_base_stock 0 (frozen review rule). If this design does not beat
      that control on mean fill and on p_meet by more than the MCSE at n = 100, the postponement content
      is zero and the whole gain is the campaign offtake, which belongs to family 7 or 8, not here. Evidence
      kill: ask a named CDMO whether it will sell filled, capped, cap-coded, unlabeled units to a third-party
      labeler under a campaign supply agreement, and at what minimum campaign size and term. A no from
      two of three CDMOs kills the architecture regardless of what the model says.'
  notes: 'PRELIMINARY / ILLUSTRATIVE / NOT FOR EXTERNAL CLAIMS. Illustrative with no source: reserved_cdmo
    scale 0.5; exercise_batches_per_year 6.0 (the only documented cadence anywhere in the sweep is BARDA''s
    one lot per product per site per year, F7-S02); activation_failure_probability 0.15 (per-supplier
    hazard rates are not public, prior-art review section 7 item 22); take_or_pay_fraction 0.5, site_fg_days
    120 and safety_stock_days 30 are starting points inside the searched space. delivery_days 10.0 = frozen
    S0''s 5 transport days plus a 5-day finish, where the 5 days is one rare-disease injectable labeled
