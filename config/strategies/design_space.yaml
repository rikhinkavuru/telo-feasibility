      which puts it in prior-approval-supplement territory with a possible pre-approval inspection (F3-S45
      VI.A and VI.B.4). No site is owned, built or moved by Telo.
    regulatory_owner: 'Telo as ANDA or NDA holder, or Telo as labeler under a partner ANDA. G01 is UNCERTAIN
      either way. The distributed-manufacturing-establishment registration route is not available: the
      proposed rule requires one management and a single quality unit and the repository reads it as excluding
      unaffiliated contract manufacturers (F3-R4), a secondary read that stays UNCERTAIN until counsel
      checks the affiliation language.'
    quality_owner: 'One Telo quality unit approves or rejects every batch at every site. This is non-delegable:
      21 CFR 211.22(a) (F3-S42), 21 CFR 200.10(b) treating extramural facilities as an extension of the
      manufacturer (F3-S43), and FDA quality-agreements guidance stating that a quality agreement cannot
      delegate CGMP responsibility (F3-S41). Consequence carried into the model: all three sites are declared
      in cc_quality.'
    supplier_graph: central and cdmo_r2 draw api_1, vial_1, stopper_1. second_source draws api_2, vial_2,
      stopper_1. vial_2 is a declared extra supplier at the same lead-time factor as vial_1. stopper_1
      is shared by every site and the frozen roster gives it no common-cause group, so container-closure
      concentration is understated for this and every other strategy in the package.
    material_flow: Each site procures its own API, vials and stoppers and ships released finished product
      to the four regions. No intermediate material moves between sites, so there is no bulk hold and
      the EMA 24-hour refiltration expectation does not apply.
    production_steps: Compounding, filtration and filling, sterilization as the presentation requires,
      inspection, packaging, testing and disposition, all performed by the partner at the partner site.
      Telo performs none of them and provides no manufacturing operating system across partner sites,
      because the cross-family review finds no OS sub-form that reaches a binding mechanism and a shared
      OS version is itself a common-cause group.
    release_pathway: Conventional, release scenario R0. Sterility 14 days, environmental monitoring 7,
      assay 5, endotoxin 2, QA disposition 2, all at frozen values. The network changes neither the duration
      nor the components; it moves the decision to Telo quality unit staff working at the partner site
      (F3-S41, F3-S42, F3-R3). No release-assurance, rapid-micro or parametric claim is made.
    inventory_policy: Regional order-up-to policy with safety_stock_days searched from 30 to 365 and the
      regional review rule exposed as an explicit binary (region_base_stock), because Phase A records
      the frozen review rule as decisive in 8 of 16 cells and as a model artifact (MD-3). Site finished
      goods 30 days; material target 60 days with a 14-day reorder point.
    allocation_policy: 'Proportional to regional request. Stated weakness: allocation rights are the central
      power in every family-3 precedent (BARDA holding the final determination of capacity use, F3-S10;
      the Commission activating EU FAB, F3-S1; Civica allocating to members, F3-S23) and they are effectively
      inert in this engine, which never populates the minimum-guarantee mapping and sets every criticality
      weight to 1.0.'
    customer: Hospital systems and their group purchasing organizations, buying finished vials. Civica
      is the only proved assembly of this demand side, at about 1,400 hospitals and over 30 percent of
      licensed beds (F3-S30).
    revenue_mechanism: Unit price on delivered vials under a multi-year committed-volume supply agreement.
      No reservation fee, no availability payment and no readiness charge in this candidate, which is
      the point of separating it from the reserved-capacity candidate.
    contracting_requirement: 'Buyer side, a take-or-pay minimum volume of roughly half expected volume
      over a multi-year term, which is the shape Civica launched with (F3-S23); GAO records that Civica
      stopped using five-year member terms in 2024 while keeping multi-year manufacturer contracts (F3-S25).
