    was removed from the search block and replaced by `material_target_days`: take-or-pay enters only
    the cost ledger, changes no service quantity, and an optimizer selecting on cost would therefore have
    driven the instrument that pays for the reserved line to zero (MD-24). It is swept as a labelled contract
