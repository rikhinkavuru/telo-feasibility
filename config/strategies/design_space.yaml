    bite this candidate specifically: MD-4 means every safety-stock conclusion predating 2026-09-03 must
    be re-run, and MD-3 means a result driven by region_base_stock alone is an artifact of a rule the
    protocol never specifies. The free-opening-inventory defect found during Phase B judging also flatters
    it. Configured from candidate key vn_base_surge_reserve (judge tally 9.52, 2 keeps). VERIFICATION
    PASS 2026-09-03 (revision R007): cc_stopper_1 and cc_geo_<region> are now declared on every site plan
    under convention NEW-4 in this file''s header, so this design''s group count changed and every run
    of it made before 2026-09-03 is superseded. S0-S7 carry neither group, so any comparison against them
    must either give them the same groups or report the gap, and the labelled matched-membership control
    (same group count, split membership) has to be run before the added Poisson hazard is read as an added
    correlation. Three configuration corrections on 2026-09-03. (1) MD-17: second_source sits at commissioning_days
    365, which equals warm_up_days, so 180 and 730 must be run as labelled sensitivities before any commissioning
    claim is quoted; this design carried no MD-17 disclosure before. (2) `take_or_pay_fraction` was removed
