# Official source registry (protocol Appendix E, workbook 02_Sources, source probe 2026-09-01).
# Every entry says how the study may acquire it: `auto` (fetched by scripts/acquire_sources.py
# under the recorded robots/rate rules) or `human` (a person must retrieve it; the script
# writes a HUMAN-ACQUISITION-TASK manifest and nothing else). No source is fetched by
# circumventing an access control. Tiers per protocol 5.3.
version: 1.0.0
user_agent: "TeloFeasibilityStudy/0.1 (research; contact rikhin@virahacks.com)"
default_min_interval_seconds: 5
sources:
  - id: S01
    name: FDA Drug Shortages database (current-state CSV export)
    domain: shortages
    tier: 1
    landing_url: https://dps.fda.gov/drugshortages
    access_method: auto
    license_note: "FDA website policies: contents of fda.gov are not copyrighted and are in the public domain; credit appreciated but not required."
    robots_note: "www.accessdata.fda.gov/robots.txt allows /scripts/drugshortages/; Hit-rate 30 s; Visiting-hours 23:00-05:00 EDT."
    min_interval_seconds: 30
    visiting_hours_edt: ["23:00", "05:00"]
    update_frequency: daily (per openFDA mirror); not stated on site
    notes: "Current-state snapshot with 22 columns; only 7 Resolved rows; shortage history needs repeated snapshots or the Initial Posting Date column. 2026-09-01 probe: sodium bicarbonate 19 rows, furosemide 33, norepinephrine 0, acyclovir 0."
    fetches:
      - key: csv
        url: https://www.accessdata.fda.gov/scripts/drugshortages/Drugshortages.cfm
        filename: Drugshortages.csv
        max_bytes: 5000000
      - key: detail_sodium_bicarbonate
        url: "https://www.accessdata.fda.gov/scripts/drugshortages/dsp_ActiveIngredientDetails.cfm?AI=Sodium+Bicarbonate+Injection&st=c"
        filename: detail_sodium_bicarbonate_injection.html
        max_bytes: 2000000
      - key: detail_furosemide
        url: "https://www.accessdata.fda.gov/scripts/drugshortages/dsp_ActiveIngredientDetails.cfm?AI=Furosemide+Injection&st=c"
        filename: detail_furosemide_injection.html
        max_bytes: 2000000
