  - id: S27
    name: USASpending award search (Phlow ASPR contract; Civica awards)
    domain: contracts
    tier: 1
    landing_url: https://api.usaspending.gov/docs/endpoints
    access_method: auto
    license_note: US government work
    robots_note: api.usaspending.gov robots.txt 404; documented public API without key
    min_interval_seconds: 5
    update_frequency: continuous
    notes: "Probe 2026-09-01: Phlow contract 75A50120C00092, $696,665,953.98, ASPR, 2020-05-18 to 2027-01-13; no Civica reserved-capacity prime award."
    fetches:
      - key: phlow_awards
        url: https://api.usaspending.gov/api/v2/search/spending_by_award/
        method: POST
        filename: usaspending_phlow.json
        max_bytes: 5000000
        body:
          filters:
            keywords: ["Phlow"]
            award_type_codes: ["A", "B", "C", "D"]
          fields: ["Award ID", "Recipient Name", "Award Amount", "Total Outlays", "Start Date", "End Date", "Awarding Agency", "Description"]
          limit: 50
