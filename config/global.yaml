  capacity_expansion_days:
    id: capacity_expansion_days
    definition: Elapsed days from the decision to expand an existing, registered site until the added capacity can run commercial batches. Applies to capacity above what the site runs on day zero; the day-zero capacity is available immediately.
    units: days
    entity_level: site
    low: 90
    base: 270
    high: 730
    bounds: [0, 2000]
    evidence_tier: 5
    confidence: low
    validation_status: illustrative
    source_locator: "no source; introduced 2026-09-03 by revision R004 to close model defect MD-7 (docs/design_space/bottleneck_decomposition.md section 7), which let capacity_factor rescale an existing plant instantly while identical capacity added as a new site waited node_commissioning_days. Base moved from 365 to 270 by revision R008 for MD-17: expanding a registered line is a change to an existing establishment (equipment installation plus a change filed under 21 CFR 314.70), not the qualification of a new one, so it must not default to second_source_qualification_days; and 365 equals warm_up_days, so a site available on exactly that day opens on the first measured day and its commissioning costs nothing inside the measured window, which makes the parameter unobservable at its own base"
    outputs_it_can_reverse: [fill_rate, shortage_days_per_year, meets_fill_rate, cost_per_delivered_unit]
    notes: "The base equals second_source_qualification_days (365 d), the closest sourced analogue already in this configuration: qualifying added capacity at a registered site should not be faster than qualifying a second source, and should be faster than building a new node (node_commissioning_days 730 d), which the low and high bracket. Replace with vendor and engineering evidence (HA-13). Set the design variable instant_expansion to 1 to restore the pre-R004 behaviour for a sensitivity run."
